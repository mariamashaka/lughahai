<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lugha Hai — Profile</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .lang-switcher{display:flex;align-items:center;background:var(--cream-dark);border-radius:var(--radius-xl);padding:3px;gap:2px;}
    .lang-switcher__btn{padding:4px 12px;border-radius:var(--radius-xl);border:none;background:transparent;font-size:0.8rem;font-weight:500;color:var(--text-soft);cursor:pointer;transition:all var(--transition);}
    .lang-switcher__btn.active{background:var(--white);color:var(--green-deep);box-shadow:0 1px 4px var(--shadow-warm);}
    .avatar{width:64px;height:64px;border-radius:50%;background:var(--green-deep);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:600;flex-shrink:0;}
    .profile-header{background:var(--white);border:1px solid var(--cream-border);border-radius:var(--radius-lg);padding:var(--space-xl);box-shadow:0 2px 12px var(--shadow-warm);display:flex;align-items:flex-start;gap:var(--space-lg);margin-bottom:var(--space-xl);}
    .profile-header__name{font-size:1.3rem;font-weight:600;color:var(--green-deep);margin-bottom:4px;}
    .profile-header__email{font-size:0.875rem;color:var(--text-soft);margin-bottom:var(--space-md);}
    .card{background:var(--white);border:1px solid var(--cream-border);border-radius:var(--radius-lg);padding:var(--space-lg);box-shadow:0 2px 8px var(--shadow-warm);margin-bottom:var(--space-md);}
    .card__title{font-size:0.72rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--space-md);padding-bottom:var(--space-sm);border-bottom:1px solid var(--cream-border);}
    .role-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:var(--radius-xl);font-size:0.78rem;font-weight:500;background:var(--cream-dark);color:var(--text-mid);}
    .request-role-card{background:var(--green-mist);border:1px solid var(--green-pale);border-radius:var(--radius-lg);padding:var(--space-lg);margin-bottom:var(--space-md);}
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-md);}
    .stat-item{text-align:center;}
    .stat-item__value{font-size:1.4rem;font-weight:600;color:var(--green-deep);}
    .stat-item__label{font-size:0.72rem;color:var(--text-muted);}
    .loading{text-align:center;padding:var(--space-2xl);color:var(--text-muted);}
    @media(max-width:800px){.two-col{grid-template-columns:1fr !important;}}
  </style>
</head>
<body>

  <nav class="nav">
    <div class="container">
      <div class="nav__inner">
        <a href="../index.html" class="nav__logo">Lugha <span>Hai</span></a>
        <div class="nav__actions">
          <div class="lang-switcher">
            <button class="lang-switcher__btn active" onclick="setLang('sw')" id="btn-sw">SW</button>
            <button class="lang-switcher__btn" onclick="setLang('en')" id="btn-en">EN</button>
          </div>
          <button onclick="handleSignOut()" class="btn btn--ghost btn--sm" data-i18n="nav_signout">Toka</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="section">
    <div class="container" id="mainContainer">
      <div class="loading">⏳</div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer__logo">Lugha Hai</div>
      <p class="footer__tagline" data-i18n="footer_tagline">Lugha hai, zilizohifadhiwa kwa vizazi.</p>
      <div class="footer__bottom">
        <span>© 2026 Lugha Hai.</span>
        <span style="color:var(--green-pale);font-size:0.8rem;">Created by Mariia Rukavishnikova · Built with ♥ in Tanzania</span>
      </div>
    </div>
  </footer>

  <script type="module">
    import { getUser, getUserRoles, signOut, supabase } from '../js/supabase.js'

    const i18n = {
      sw: {
        nav_signout:"Toka",
        footer_tagline:"Lugha hai, zilizohifadhiwa kwa vizazi.",
        role_learner:"Mwanafunzi", role_contributor:"Mchangiaji",
        role_moderator:"Msimamizi", role_admin:"Msimamizi Mkuu",
        roles_title:"Majukumu yangu",
        no_roles:"Una jukumu la mwanafunzi tu kwa sasa.",
        request_title:"Omba jukumu jipya",
        request_text:"Je, unazungua lugha ya urithi? Omba jukumu la mchangiaji au msimamizi. Tutawasiliana nawe kupitia WhatsApp.",
        request_role_label:"Jukumu unalotaka",
        request_lang_label:"Lugha",
        request_note_label:"Maelezo (hiari)",
        request_note_ph:"Eleza kwa nini unataka jukumu hili...",
        request_btn:"Tuma ombi",
        request_sent:"✓ Ombi limetumwa! Tutawasiliana nawe hivi karibuni.",
        opt_contributor:"Mchangiaji — ninazungua lugha hii",
        opt_moderator:"Msimamizi — ninaweza kukagua maudhui",
        stats_title:"Takwimu",
        stat_topics:"Mada zilizokamilika",
        stat_pending:"Zinasubiri ukaguzi",
        stat_earned:"TZS iliyopatikana",
        explore_btn:"Gundua lugha",
        not_logged:"Tafadhali ingia kwanza.",
        login_btn:"Ingia"
      },
      en: {
        nav_signout:"Sign out",
        footer_tagline:"Living languages, preserved for generations.",
        role_learner:"Learner", role_contributor:"Contributor",
        role_moderator:"Moderator", role_admin:"Admin",
        roles_title:"My roles",
        no_roles:"You are a learner only for now.",
        request_title:"Request a new role",
        request_text:"Do you speak a heritage language? Request contributor or moderator role. We will contact you via WhatsApp.",
        request_role_label:"Role you want",
        request_lang_label:"Language",
        request_note_label:"Notes (optional)",
        request_note_ph:"Explain why you want this role...",
        request_btn:"Send request",
        request_sent:"✓ Request sent! We will contact you soon.",
        opt_contributor:"Contributor — I speak this language",
        opt_moderator:"Moderator — I can review content",
        stats_title:"Stats",
        stat_topics:"Topics completed",
        stat_pending:"Pending review",
        stat_earned:"TZS earned",
        explore_btn:"Explore languages",
        not_logged:"Please sign in first.",
        login_btn:"Sign in"
      }
    }

    let currentLang = localStorage.getItem('lh_lang') || 'sw'
    let currentUser = null
    let userRoles   = []
    let languages   = []

    window.setLang = function(lang) {
      currentLang = lang
      localStorage.setItem('lh_lang', lang)
      document.getElementById('btn-sw').classList.toggle('active', lang==='sw')
      document.getElementById('btn-en').classList.toggle('active', lang==='en')
      const t = i18n[lang]
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n')
        if (t[key] !== undefined) el.textContent = t[key]
      })
    }

    window.handleSignOut = async function() {
      await signOut()
      window.location.href = '../index.html'
    }

    async function init() {
      // Load languages from JSON (not Supabase)
      try {
        const res  = await fetch('../data/languages.json')
        const data = await res.json()
        languages  = data.languages || []
      } catch(e) {
        languages = [
          { id:'kikurya',    name:'Kikurya' },
          { id:'kinyamwezi', name:'Kinyamwezi' }
        ]
      }

      const user = await getUser()

      if (!user) {
        const t = i18n[currentLang]
        document.getElementById('mainContainer').innerHTML = `
          <div style="text-align:center;padding:var(--space-2xl);">
            <p style="color:var(--text-muted);margin-bottom:var(--space-lg);">${t.not_logged}</p>
            <a href="../auth/login.html" class="btn btn--primary">${t.login_btn}</a>
          </div>`
        return
      }

      currentUser = user
      userRoles   = await getUserRoles(user.id)

      // Get profile
      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .single()

      render(user, profile)
    }

    function render(user, profile) {
      const t = i18n[currentLang]

      const name     = profile?.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || '?'
      const email    = user.email || ''
      const initials = name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase()

      const roleLabel = { learner:t.role_learner, contributor:t.role_contributor, moderator:t.role_moderator, admin:t.role_admin }
      const roleIcon  = { learner:'📖', contributor:'🗣️', moderator:'✅', admin:'⚙️' }

      const nonLearner = userRoles.filter(r => r.role !== 'learner' && r.language_id !== '*')

      const langOptions = languages.map(l => `<option value="${l.id}">${l.name}</option>`).join('')

      document.getElementById('mainContainer').innerHTML = `

        <div class="profile-header">
          <div class="avatar">${initials}</div>
          <div style="flex:1;">
            <div class="profile-header__name">${name}</div>
            <div class="profile-header__email">${email}</div>
            <div style="display:flex;gap:var(--space-sm);flex-wrap:wrap;margin-top:var(--space-sm);">
              <span class="role-badge">📖 ${t.role_learner}</span>
              ${nonLearner.map(r =>
                `<span class="role-badge badge--approved" style="background:var(--green-mist);color:var(--green-deep);">
                  ${roleIcon[r.role]||'👤'} ${roleLabel[r.role]||r.role} · ${r.language_id}
                </span>`
              ).join('')}
            </div>
          </div>
        </div>

        <div class="two-col" style="display:grid;grid-template-columns:1fr 280px;gap:var(--space-xl);align-items:start;">

          <div>
            <!-- Roles -->
            <div class="card">
              <div class="card__title">${t.roles_title}</div>
              ${nonLearner.length === 0
                ? `<p style="font-size:0.85rem;color:var(--text-soft);">${t.no_roles}</p>`
                : nonLearner.map(r => `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-sm) 0;border-bottom:1px solid var(--cream-border);">
                      <span>${roleIcon[r.role]||'👤'} ${roleLabel[r.role]||r.role}</span>
                      <span class="badge badge--approved" style="font-size:0.72rem;">${r.language_id}</span>
                    </div>`
                  ).join('')
              }
            </div>

            <!-- Request role -->
            <div class="request-role-card">
              <div style="font-size:0.9rem;font-weight:600;color:var(--green-deep);margin-bottom:var(--space-sm);">${t.request_title}</div>
              <p style="font-size:0.82rem;color:var(--text-mid);line-height:1.6;margin-bottom:var(--space-md);">${t.request_text}</p>
              <div id="requestForm" style="display:flex;flex-direction:column;gap:var(--space-md);">
                <div class="form-group">
                  <label class="form-label">${t.request_role_label}</label>
                  <select class="form-select" id="reqRole">
                    <option value="contributor">${t.opt_contributor}</option>
                    <option value="moderator">${t.opt_moderator}</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">${t.request_lang_label}</label>
                  <select class="form-select" id="reqLang">${langOptions}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">${t.request_note_label}</label>
                  <textarea class="form-input" id="reqNote" placeholder="${t.request_note_ph}" style="min-height:80px;resize:vertical;"></textarea>
                </div>
                <button class="btn btn--primary btn--sm" onclick="sendRoleRequest()">${t.request_btn}</button>
              </div>
              <div id="requestSuccess" style="display:none;color:var(--green-deep);font-size:0.9rem;font-weight:500;">${t.request_sent}</div>
            </div>
          </div>

          <div style="position:sticky;top:80px;">
            <div class="card">
              <div class="card__title">${t.stats_title}</div>
              <div class="stat-grid">
                <div class="stat-item"><div class="stat-item__value">0</div><div class="stat-item__label">${t.stat_topics}</div></div>
                <div class="stat-item"><div class="stat-item__value">0</div><div class="stat-item__label">${t.stat_pending}</div></div>
                <div class="stat-item"><div class="stat-item__value">0</div><div class="stat-item__label">${t.stat_earned} TZS</div></div>
              </div>
            </div>
            <a href="../index.html" class="btn btn--secondary w-full" style="justify-content:center;display:flex;">${t.explore_btn}</a>
          </div>
        </div>`

      window.setLang(currentLang)
    }

    window.sendRoleRequest = async function() {
      const t    = i18n[currentLang]
      const role = document.getElementById('reqRole').value
      const lang = document.getElementById('reqLang').value

      const { error } = await supabase
        .from('user_roles')
        .upsert({
          user_id:     currentUser.id,
          language_id: lang,
          role:        role,
          status:      'pending'
        }, { onConflict: 'user_id,language_id,role' })

      if (!error) {
        document.getElementById('requestForm').style.display    = 'none'
        document.getElementById('requestSuccess').style.display = 'block'
      }
    }

    window.setLang(currentLang)
    init()
  </script>
</body>
</html>
