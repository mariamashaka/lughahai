<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lugha Hai — Somo la 1</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#64abd9; }
    #stage { position:fixed; inset:0; overflow:hidden; background:#64abd9; }
    .layer { position:absolute; left:0; right:0; background-repeat:repeat-x; background-position:left bottom; image-rendering:pixelated; }
    #far    { background-image:url(assets/scene/far.png); }
    #ground { bottom:0; background-image:url(assets/scene/ground.png); }
    .actor { position:absolute; image-rendering:pixelated; user-select:none; -webkit-user-drag:none; }
    #hero { transform:scaleX(-1); }

    .topbar { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; z-index:6; gap:8px; }
    .pill { color:#fff; background:rgba(20,30,25,.55); border-radius:999px; padding:6px 14px; font-size:.85rem; text-decoration:none; font-family:var(--font-body, system-ui, sans-serif); border:none; cursor:pointer; }
    .switcher { display:flex; background:rgba(20,30,25,.55); border-radius:999px; padding:3px; gap:2px; }
    .switcher button { border:none; background:transparent; color:#fff; padding:4px 12px; border-radius:999px; font-size:.8rem; cursor:pointer; font-family:inherit; }
    .switcher button.active { background:#fff; color:#2C4A3E; font-weight:600; }
    .progress { position:absolute; top:112px; left:50%; transform:translateX(-50%); width:min(360px,60vw); height:6px; background:rgba(20,30,25,.35); border-radius:3px; z-index:6; overflow:hidden; }
    .progress > i { display:block; height:100%; width:0; background:#F7F3EC; transition:width .3s; }


    #trail { position:absolute; top:48px; left:50%; transform:translateX(-50%); width:min(640px, calc(100vw - 24px)); height:60px; z-index:6; font-family:var(--font-body, system-ui, sans-serif); color:#fff; }
    #trail .tt { position:absolute; top:0; left:0; right:0; text-align:center; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; opacity:.9; text-shadow:0 1px 3px rgba(0,0,0,.6); }
    #trail svg { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
    #trail .nodes { position:absolute; left:0; right:0; top:14px; display:flex; }
    #trail .n { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; cursor:pointer; background:none; border:none; color:inherit; font:inherit; padding:0; }
    #trail .nd { width:28px; height:28px; border-radius:50%; box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; background:rgba(20,30,25,.72); border:2px solid rgba(255,255,255,.55); color:#fff; transition:transform .2s; }
    #trail .n.done .nd { background:#3FA66B; border-color:#BFEBD0; }
    #trail .n.cur .nd { background:#F7F3EC; color:#2C4A3E; border-color:#E8A882; box-shadow:0 0 0 3px rgba(232,168,130,.45); animation:pulse 1.6s ease-in-out infinite; }
    #trail .n.lock .nd { opacity:.65; }
    #trail .nl { margin-top:2px; max-width:100%; font-size:.62rem; line-height:1.15; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.7); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px; box-sizing:border-box; }
    #trail .n.lock .nl { opacity:.8; }
    #trail .n.shake .nd { animation:shake .35s; }
    @keyframes pulse { 50% { transform:scale(1.1); } }
    @keyframes shake { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
    #toast { position:absolute; top:112px; left:50%; transform:translateX(-50%); background:rgba(24,34,29,.92); color:#F7F3EC; padding:6px 14px; border-radius:999px; font-size:.82rem; z-index:9; opacity:0; transition:opacity .25s; pointer-events:none; font-family:var(--font-body, system-ui, sans-serif); white-space:nowrap; }
    #toast.on { opacity:1; }
    #bubble { --bg:rgba(24,34,29,.9); position:absolute; top:126px; left:12px; width:min(540px, calc(100vw - 48px)); box-sizing:border-box;
              background:var(--bg); color:#F7F3EC; border-radius:18px; padding:14px 16px; display:flex; gap:14px; align-items:center;
              filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)); z-index:5; font-family:var(--font-body, system-ui, sans-serif); }
    #bubble::after { content:''; position:absolute; bottom:-18px; left:32px; width:30px; height:20px; background:var(--bg); clip-path:polygon(0 0,100% 0,0 100%); }
    #bubble.you { left:auto; right:12px; flex-direction:row-reverse; }
    #bubble.you::after { left:auto; right:32px; clip-path:polygon(0 0,100% 0,100% 100%); }
    #portrait { image-rendering:pixelated; flex:none; width:72px; height:72px; border-radius:10px; background:rgba(255,255,255,.08); }
    #portrait[hidden] { display:none; }
    #bubble .body { flex:1; min-width:0; }
    #who { font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; opacity:.8; margin-bottom:2px; }
    #main { font-family:var(--font-display, Georgia, serif); font-size:clamp(1.25rem,3.4vw,1.8rem); line-height:1.25; font-weight:600; margin:0; color:#F7F3EC; word-wrap:break-word; }
    #main.plain { font-family:var(--font-body, system-ui, sans-serif); font-size:clamp(1.05rem,2.6vw,1.3rem); font-weight:500; }
    #gloss { margin:4px 0 0; font-size:.95rem; opacity:.85; color:#F7F3EC; line-height:1.4; }
    #instr { margin:6px 0 0; font-size:.85rem; color:#E8A882; line-height:1.4; }
    .row { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
    .speak { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; border:2px solid rgba(247,243,236,.5); background:transparent; color:#F7F3EC; cursor:pointer; flex:none; }
    .speak[hidden] { display:none; }
    .speak:hover, .speak.playing { background:#F7F3EC; color:#2C4A3E; }
    .speak svg { width:22px; height:22px; fill:currentColor; }
    .speak.rec { border-color:#E8A882; }
    .speak.recording { background:#C0392B; border-color:#C0392B; color:#fff; animation:pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(192,57,43,.35); } }
    #priv { margin:4px 0 0; font-size:.75rem; opacity:.7; color:#F7F3EC; }
    .btn { background:#C4714A; color:#fff; border:none; border-radius:999px; padding:.65rem 1.6rem; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn:hover { background:#b05e38; }
    .btn.ghost { background:transparent; border:2px solid rgba(247,243,236,.5); }

    #end { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:56px 16px 16px; box-sizing:border-box; z-index:7; }
    #end.active { display:flex; }
    #end .plate { max-width:560px; width:100%; background:rgba(24,34,29,.88); color:#F7F3EC; border-radius:18px; padding:clamp(16px,3vw,28px); text-align:center; box-shadow:0 8px 32px rgba(0,0,0,.35); font-family:var(--font-body, system-ui, sans-serif); }
    #end h1 { color:#F7F3EC; margin:0 0 .5em; font-family:var(--font-display, Georgia, serif); font-size:clamp(1.3rem,3.2vw,1.8rem); }
    #end p { color:#F7F3EC; margin:0 0 1.2em; font-size:1.05rem; line-height:1.6; }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

    #ex { position:absolute; top:126px; left:50%; transform:translateX(-50%); width:min(640px, calc(100vw - 24px)); max-height:calc(100vh - 142px); overflow:auto; box-sizing:border-box;
          background:rgba(24,34,29,.9); color:#F7F3EC; border-radius:18px; padding:16px; z-index:5; display:none; box-shadow:0 8px 32px rgba(0,0,0,.35); font-family:var(--font-body, system-ui, sans-serif); }
    #ex.active { display:block; }
    [hidden] { display:none !important; }
    #ex p { color:#F7F3EC; }
    .exhead { display:flex; align-items:center; gap:14px; margin:0 0 10px; }
    #ex-face { image-rendering:pixelated; flex:none; width:84px; height:84px; border-radius:12px; background:rgba(255,255,255,.08); }
    #ex-face.bounce { animation:bounce .5s ease-out; }
    #ex-face.wag { animation:wag .6s ease-in-out 2; }
    @keyframes bounce { 0%{transform:translateY(0)} 35%{transform:translateY(-10px)} 70%{transform:translateY(2px)} 100%{transform:translateY(0)} }
    @keyframes wag { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 75%{transform:rotate(7deg)} }
    #ex-title { font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; opacity:.8; margin:0 0 4px; }
    #ex-fb { white-space:pre-line; }
    .pill.off { opacity:.55; text-decoration:line-through; }
    #ex-prompt { display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0 14px; text-align:center; flex-wrap:wrap; }
    #ex-prompt .big { font-family:var(--font-display, Georgia, serif); font-size:clamp(1.3rem,3.6vw,1.9rem); font-weight:600; color:#F7F3EC; line-height:1.25; }
    .tag { font-size:.68rem; background:rgba(232,168,130,.25); color:#E8A882; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle; font-family:var(--font-body, system-ui, sans-serif); font-weight:500; }
    .speak[disabled] { opacity:.35; cursor:not-allowed; }
    .opts { display:grid; grid-template-columns:1fr; gap:8px; }
    @media (min-width:560px) { .opts.two { grid-template-columns:1fr 1fr; } }
    .opt { display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; color:#F7F3EC; background:rgba(255,255,255,.08); border:2px solid rgba(247,243,236,.3); border-radius:12px; padding:.7rem 1rem; font-size:1rem; line-height:1.35; cursor:pointer; font-family:inherit; }
    .opt:hover:not([disabled]) { background:rgba(255,255,255,.16); }
    .opt.good { background:rgba(80,170,110,.35); border-color:#6fcf97; }
    .opt.bad  { background:rgba(200,70,60,.35); border-color:#eb5757; }
    .opt[disabled] { cursor:default; }
    .opt .mini { flex:none; width:34px; height:34px; border-radius:50%; border:2px solid rgba(247,243,236,.5); display:inline-flex; align-items:center; justify-content:center; background:transparent; color:#F7F3EC; cursor:pointer; padding:0; }
    .opt .mini svg { width:16px; height:16px; fill:currentColor; }
    .opt .mini[disabled] { opacity:.35; cursor:not-allowed; }
    .opt.sel { border-color:#E8A882; background:rgba(232,168,130,.2); }
    .opt.done { opacity:.4; }
    #ex-fb { min-height:1.4em; margin:0; font-size:1rem; font-weight:600; color:#F7F3EC; line-height:1.35; }
    #ex-fb.good { color:#6fcf97; } #ex-fb.bad { color:#ffb4a8; }
    #ex-next { margin-top:10px; }
    @media (max-height:460px) {
      #bubble { top:112px; padding:10px 12px; gap:10px; }
      #ex { top:112px; max-height:calc(100vh - 122px); }
      #portrait { width:54px; height:54px; }
      .row { margin-top:6px; }
      .progress { top:100px; }
      #trail { top:44px; height:52px; } #trail .n { margin-top:0 !important; } #trail .nd { width:22px; height:22px; font-size:.7rem; } #trail .tt { display:none; }
    }
  </style>
</head>
<body>
<div id="stage">
  <div id="far" class="layer"></div>
  <div id="ground" class="layer"></div>
  <img id="anna" class="actor" alt="" src="assets/anna/idle0.png" />
  <img id="hero" class="actor" alt="" src="assets/hero_f/idle0.png" />

  <div class="topbar">
    <a class="pill" id="backLink" href="../language.html"></a>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="pill" id="sounds" type="button"></button>
      <button class="pill" id="restart" type="button"></button>
      <div class="switcher"><button id="btn-sw" type="button">SW</button><button id="btn-en" type="button">EN</button></div>
    </div>
  </div>
  <div id="trail"></div>
  <div id="toast"></div>
  <div class="progress"><i id="bar"></i></div>

  <div id="bubble">
    <img id="portrait" alt="" src="assets/anna_face/smile.png" />
    <div class="body">
      <div id="who"></div>
      <p id="main"></p>
      <p id="gloss"></p>
      <p id="instr"></p>
      <div class="row">
        <button class="speak" id="b-audio" type="button" hidden aria-label="Listen">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        </button>
        <button class="speak rec" id="b-rec" type="button" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button class="speak rec" id="b-mine" type="button" hidden>
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" id="next" type="button"></button>
      </div>
      <p id="priv" hidden></p>
    </div>
  </div>

  <div id="ex">
    <div class="exhead">
      <img id="ex-face" alt="" src="assets/anna_face/smile.png" />
      <div><p id="ex-title"></p><p id="ex-fb"></p></div>
    </div>
    <div id="ex-prompt"></div>
    <div class="opts" id="ex-opts"></div>
    <div style="text-align:center"><button class="btn" id="ex-next" type="button" hidden></button></div>
  </div>

  <div id="end">
    <div class="plate">
      <h1 id="e-title"></h1>
      <p id="e-text"></p>
      <div class="actions"><button class="btn" id="e-village" type="button"></button><button class="btn ghost" id="e-again" type="button"></button></div>
    </div>
  </div>
</div>

<script>
  // ---------- настройки ----------
  const SB_URL = 'https://geogbanccumdcaymhkdb.supabase.co'
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlb2diYW5jY3VtZGNheW1oa2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MDk4MjgsImV4cCI6MjA5MTk4NTgyOH0.BL1np5CpfddNE_S7x_bmHBqTHG-L7xn8PE5Jk3XIUx0'
  // Содержание урока приходит из data/lessons/<id>.json, структура курса — из data/course.json.
  let TOPIC = '', TOPIC_JSON = ''
  let EXTRA = []                // дополнительные фразы темы: варианты-обманки
  let LESSON = [], PRACTICE = [], ANSWER_OF = {}
  let LESSON_ID = ''
  const SPR = { w: 72, h: 96 }, SKY_H = 170, GROUND_H = 27, FEET_IN_GROUND = 8

  // Сценарий урока (dialogue в файле урока). who: 'anna' | 'you'. id: номер фразы в теме урока.
  // Нет записи в базе: показываем текст на SW/EN из файла темы. Есть запись: показываем и озвучиваем кикурья.

  const i18n = {
    sw: { back: '← Rudi', restart: 'Anza upya', you: 'Wewe', next: 'Endelea', said: 'Nimesema',
          instr: 'Zamu yako: sema, rekodi, kisha sikiliza na ulinganishe na mfano. Umesema sawa?',
          priv: 'Rekodi yako inabaki kwenye kifaa chako tu.', rec: 'Rekodi sauti yako', stop: 'Simamisha', mine: 'Sikiliza rekodi yako',
          mic_err: 'Kipaza sauti hakipatikani. Ruhusu matumizi ya kipaza sauti kwenye kivinjari.',
          soon: 'Somo hili linakuja hivi karibuni', locked: 'Maliza somo la awali kwanza', e_title: 'Hongera!', e_text: 'Umefanya vizuri! Sasa uko tayari kuingia kijijini.', e_village: 'Ingia kijijini', e_soon: 'Kijiji kinakuja hivi karibuni.', e_again: 'Anza somo upya', listen: 'Sikiliza',
          x_listen: 'Sikiliza na uchague maana', x_read: 'Soma na uchague maana', x_pick: 'Chagua neno sahihi kwa maana hii', x_reply: 'Anna anasema hivi. Chagua jibu sahihi.', x_match: 'Unganisha kila neno na maana yake',
          good: 'Sahihi!', redo: 'Jaribu tena!', bad: 'Jibu sahihi ni:', redobtn: 'Rudia', sounds: '🔊 Sauti', sample: 'mfano', cont: 'Endelea', noaudio: 'Bado hakuna sauti' },
    en: { back: '← Back', restart: 'Start over', you: 'You', next: 'Continue', said: 'I said it',
          instr: 'Your turn: say it, record yourself, then compare with the example. Did you say it right?',
          priv: 'Your recording stays on your device only.', rec: 'Record yourself', stop: 'Stop', mine: 'Play your recording',
          mic_err: 'The microphone is not available. Allow microphone access in your browser.',
          soon: 'This lesson is coming soon', locked: 'Finish the previous lesson first', e_title: 'Well done!', e_text: 'You did great! Now you are ready to enter the village.', e_village: 'Enter the village', e_soon: 'The village is coming soon.', e_again: 'Start the lesson again', listen: 'Listen',
          x_listen: 'Listen and choose the meaning', x_read: 'Read and choose the meaning', x_pick: 'Choose the right word for this meaning', x_reply: 'Anna says this. Choose the right reply.', x_match: 'Match each word with its meaning',
          good: 'Correct!', redo: 'Try again!', bad: 'The right answer is:', redobtn: 'Redo', sounds: '🔊 Sounds', sample: 'sample', cont: 'Continue', noaudio: 'No audio yet' }
  }

  // ---------- состояние ----------
  const $ = id => document.getElementById(id)
  const params = new URLSearchParams(location.search)
  const langId = params.get('id') || 'kikurya'
  let lang = localStorage.getItem('lh_lang') || 'sw'
  if (!i18n[lang]) lang = 'sw'
  let P = null                // профиль ученика
  let texts = {}              // id -> { sw, en } из файла темы
  let rows = {}               // 'anna|id' / 'you|id' -> строка из базы
  let idx = 0, ended = false
  let s = 3                   // масштаб пикселей

  const progressKeyOf = id => 'lh_progress_' + id + '_' + langId
  const progressKey = () => progressKeyOf(LESSON_ID)
  function loadProfile() { try { const j = JSON.parse(localStorage.getItem('lh_profile') || 'null'); return j && j.name ? j : null } catch (e) { return null } }

  // ---------- база ----------
  async function resolvePhrases(language, topic, ids, hero) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000)
    try {
      const res = await fetch(SB_URL + '/rest/v1/rpc/resolve_phrases', {
        method: 'POST', signal: ctl.signal,
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_language: language, p_topic: topic, p_phrase_ids: ids, p_hero: hero || null })
      })
      if (!res.ok) return []
      const out = await res.json()
      return Array.isArray(out) ? out : []
    } catch (e) { return [] } finally { clearTimeout(timer) }
  }
  function collectTexts(o) {
    if (Array.isArray(o)) o.forEach(collectTexts)
    else if (o && typeof o === 'object') {
      if (o.id && (o.sw || o.en)) texts[o.id] = { sw: o.sw || '', en: o.en || '' }
      Object.values(o).forEach(collectTexts)
    }
  }
  async function loadAll() {
    try { const r = await fetch(TOPIC_JSON); collectTexts(await r.json()) } catch (e) {}
    const ids = a => [...new Set(LESSON.filter(l => l.who === a && l.id).map(l => l.id))]
    EXTRA = Object.keys(texts).filter(i => !PRACTICE.includes(i)).slice(0, 14)
    const poolIds = [...new Set([...PRACTICE, ...EXTRA])]
    const [ra, ry, rp] = await Promise.all([
      resolvePhrases(langId, TOPIC, ids('anna'), 'anna'),
      resolvePhrases(langId, TOPIC, ids('you'), null),
      resolvePhrases(langId, TOPIC, poolIds, null)
    ])
    rp.forEach(r => rows['pool|' + r.phrase_id] = r)
    ra.forEach(r => rows['anna|' + r.phrase_id] = r)
    ry.forEach(r => rows['you|' + r.phrase_id] = r)
  }

  // ---------- сцена ----------
  function layout() {
    // масштаб: герои не выше ~42% экрана и оба помещаются по ширине
    s = Math.max(1, Math.min(4, Math.floor(innerHeight * 0.42 / SPR.h), Math.floor(innerWidth / 180)))
    const far = $('far'), gr = $('ground')
    far.style.height = SKY_H * s + 'px'; far.style.bottom = GROUND_H * s + 'px'; far.style.backgroundSize = 'auto 100%'
    gr.style.height = GROUND_H * s + 'px'; gr.style.backgroundSize = 'auto 100%'
    const bottom = (GROUND_H - FEET_IN_GROUND) * s
    for (const [id, dx] of [['anna', -50], ['hero', 50]]) {
      const el = $(id)
      el.style.width = SPR.w * s + 'px'; el.style.height = SPR.h * s + 'px'
      el.style.bottom = bottom + 'px'; el.style.left = `calc(50% + ${dx * s}px - ${SPR.w * s / 2}px)`
    }
    const pw = innerHeight < 460 ? 54 : 72
    $('portrait').style.width = $('portrait').style.height = (innerHeight >= 600 ? 96 : pw) + 'px'
  }

  // Анимация героев: дыхание и моргание; «wave» по команде
  const folders = { anna: 'assets/anna/', hero: null }
  function setSprite(who, frame) { const el = $(who); el.src = (who === 'anna' ? 'assets/anna/' : 'assets/' + (P && P.gender === 'm' ? 'hero_m/' : 'hero_f/')) + frame + '.png' }
  let waving = {}
  function wave(who, ms = 1800) {
    waving[who] = true; let k = 0
    const t = setInterval(() => setSprite(who, k++ % 2 ? 'wave1' : 'wave0'), 260)
    setTimeout(() => { clearInterval(t); waving[who] = false; setSprite(who, 'idle0') }, ms)
  }

  // ---------- звуки и музыка (всё синтезируется в браузере, готовых файлов нет, лицензий нет) ----------
  const AC = window.AudioContext || window.webkitAudioContext
  let ac = null, sfxBus = null
  function ensureAudio() {

  function tone(freq, t, dur, type, vol, dest) {

  // Звук «щипок» (калимба/мбира): основной тон + короткий металлический обертон
  function pluck(f, t, dur, vol, dest) { tone(f, t, dur, 'sine', vol, dest); tone(f * 5.4, t, 0.12, 'sine', vol * 0.25, dest) }
  function noiseBurst(t, dur, freq, q, vol, dest) {
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0)

  }
  // Наборы звуков по регионам мира. Сейчас готов африканский (барабан, калимба, шейкер), азиатский и южноамериканский
  // добавим отдельно; пока для них играет африканский. Национальные инструменты народов даём в уроках про культуру.
  const PACKS = {
    africa: {
      tap()  { const t = ac.currentTime; drum(t, 260, 120, 0.09, 0.32, sfxBus); noiseBurst(t, 0.03, 1800, 1, 0.18, sfxBus) },
      good() { const t = ac.currentTime; [523.25, 659.25, 783.99].forEach((f, i) => pluck(f, t + i * 0.09, 0.55, 0.3, sfxBus)) },
      bad()  { const t = ac.currentTime; drum(t, 190, 95, 0.28, 0.55, sfxBus); drum(t + 0.17, 150, 70, 0.34, 0.55, sfxBus) },
      done() { const t = ac.currentTime; [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => pluck(f, t + i * 0.1, 0.7, 0.3, sfxBus)); [0.55, 0.68, 0.81].forEach(d => noiseBurst(t + d, 0.09, 6500, 2, 0.22, sfxBus)) }
    }
  }
  let soundPack = 'africa'
  const pack = () => PACKS[soundPack] || PACKS.africa
  let sfxOn = localStorage.getItem('lh_sfx') !== 'off'
  const sfx = {
    tap()  { if (sfxOn && ensureAudio()) pack().tap() },

  function toggleSounds() {

  document.addEventListener('click', e => { if (e.target.closest('.opt, .btn, .speak, .mini') && !e.target.closest('#sounds')) sfx.tap() })
  // ---------- запись ученика (остаётся на устройстве, никуда не отправляется) ----------
  let rec = null, recStream = null, recChunks = [], mineUrl = null, mineAudio = null, recTimer = null
  const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)
  function clearMine() {

  function stopRecording(discard) {

  async function toggleRecording() {

        $('b-rec').classList.remove('recording'); $('b-rec').setAttribute('aria-label', L.rec)

  // ---------- реплики ----------
  function currentText(line) {

  function showLine() {

  function renderStatic() {

  // PRACTICE (что учим) и ANSWER_OF (на какую фразу Анны это ответ) берутся из файла урока
  const NEED = 2                                                           // сколько раз подряд верно
  let streak = {}, lastTypes = [], matchDone = false, exState = null, practicing = false, redoId = null
  function exFace(name, anim) { const f = $('ex-face'); f.src = 'assets/anna_face/' + name + '.png'; f.className = ''; if (anim) { void f.offsetWidth; f.classList.add(anim) } }
  const practiceKey = () => 'lh_practice_' + LESSON_ID + '_' + langId
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
  const ICON = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>'

  // Данные фразы. Нет записи в базе: слово на языке заменяет заглушка (тот же текст на языке интерфейса) с пометкой «образец».

  // ---------- тропинка раздела (карта уроков) ----------
  const COURSE_FALLBACK = { sections: [{ id: 'village', title: { sw: 'Karibu kijijini', en: 'Welcome to the village' }, lessons: [

  let COURSE = COURSE_FALLBACK, CUR_LESSON = ''

    const tr = $('trail'), pick = o => (o && (o[lang] || o.en || o.sw)) || ''
    tr.innerHTML = '<div class="tt"></div><svg></svg><div class="nodes"></div>'
    tr.querySelector('.tt').textContent = pick(sec.title)
    const box = tr.querySelector('.nodes')
    sec.lessons.forEach((les, i) => {
      const st = lessonState(les, i, sec.lessons), b = document.createElement('button')
      b.type = 'button'; b.className = 'n ' + st
      b.innerHTML = '<span class="nd"></span><span class="nl"></span>'
      b.querySelector('.nd').textContent = st === 'done' ? '✓' : i + 1
      b.querySelector('.nl').textContent = pick(les.title); b.title = pick(les.title)
      b.style.marginTop = (i % 2 ? 6 : 0) + 'px'
      b.onclick = () => {
        if (les.id === CUR_LESSON) return
        if (!les.ready) { toast(i18n[lang].soon) } else if (st === 'lock') { toast(i18n[lang].locked) }
        else { location.href = 'lesson.html?id=' + encodeURIComponent(langId) + '&lesson=' + encodeURIComponent(les.id) }
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake')
      }
      box.appendChild(b)
    })
    drawTrailLine()
  }
  function drawTrailLine() {
    const tr = $('trail'), svg = tr.querySelector('svg'), r0 = tr.getBoundingClientRect(), nds = [...tr.querySelectorAll('.nd')]
    if (nds.length < 2) return
    const pts = nds.map(n => { const r = n.getBoundingClientRect(); return [r.left - r0.left + r.width / 2, r.top - r0.top + r.height / 2] })
    let d = 'M' + pts[0].join(',')
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2, w = (i % 2 ? -1 : 1) * 7
      d += ` Q${mx},${(y0 + y1) / 2 + w} ${x1},${y1}`
    }
    svg.innerHTML = `<path d="${d}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>`
  }
  addEventListener('resize', () => { try { drawTrailLine() } catch (e) {} })
  async function loadCourse() { try { const j = await (await fetch('../data/course.json')).json(); if (j && j.sections) COURSE = j } catch (e) {} }

  // ---------- запуск ----------
  $('btn-sw').onclick = () => setLang('sw'); $('btn-en').onclick = () => setLang('en')
  $('next').onclick = next
  $('sounds').onclick = toggleSounds
  $('b-rec').onclick = toggleRecording
  $('b-mine').onclick = playMine
  $('b-audio').onclick = () => { const t = currentText(LESSON[idx]); play(t.audio, LESSON[idx].who === 'anna') }
  $('e-again').onclick = again
  $('e-village').onclick = () => { $('e-text').textContent = i18n[lang].e_soon; $('e-village').hidden = true }
  $('restart').onclick = () => {
    try { localStorage.removeItem('lh_profile'); localStorage.removeItem(progressKey()); localStorage.removeItem(practiceKey()) } catch (e) {}
    location.href = 'index.html?id=' + encodeURIComponent(langId)
  }
  addEventListener('resize', layout)

  async function init() {
    P = loadProfile()
    if (!P) { location.replace('index.html?id=' + encodeURIComponent(langId)); return }
    $('backLink').href = '../language.html?id=' + encodeURIComponent(langId)
    setSprite('anna', 'idle0'); setSprite('hero', 'idle0')
    layout(); idleLoop('anna', 0); idleLoop('hero', 130)
    fetch('../data/languages.json').then(r => r.json()).then(j => {
      const l = (j.languages || []).find(x => x.id === langId), reg = ((l && (l.region || l.subregion)) || '').toLowerCase()
      soundPack = reg.includes('asia') ? 'asia' : reg.includes('america') ? 'south_america' : 'africa'
    }).catch(() => {})
    await loadCourse()
    LESSON_ID = params.get('lesson') || COURSE.sections[0].lessons[0].id
    CUR_LESSON = LESSON_ID
    try {
      const lj = await (await fetch('../data/lessons/' + encodeURIComponent(LESSON_ID) + '.json')).json()
      LESSON = lj.dialogue || []; PRACTICE = lj.practice || []; ANSWER_OF = lj.answer_of || {}
      TOPIC = lj.topic; TOPIC_JSON = '../' + lj.topic_json
    } catch (e) { toast('Somo halipatikani / Lesson not found'); $('bubble').style.display = 'none'; renderTrail(); return }
    // перенос прогресса со старых ключей (до появления файлов уроков)
    try { if (LESSON_ID === 'village-1') for (const [o, n] of [['lh_lesson1_' + langId, progressKey()], ['lh_practice1_' + langId, practiceKey()]]) { const v = localStorage.getItem(o); if (v !== null && localStorage.getItem(n) === null) localStorage.setItem(n, v); localStorage.removeItem(o) } } catch (e) {}
    renderStatic()                        // сразу показываем первую реплику на SW/EN, пока грузится база
    await loadAll()
    const saved = parseInt(localStorage.getItem(progressKey()) || '0', 10)
    idx = isNaN(saved) || saved >= LESSON.length ? 0 : saved
    loadStreak()
    if (localStorage.getItem(progressKey()) === 'done' && allDone()) { startPractice(); return }   // всё пройдено: сразу финальный экран
    if (score() > 0) { startPractice(); return }                                                    // практика уже начата
    showLine()
  }
  init()
</script>
</body>
</html>
