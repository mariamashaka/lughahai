<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lugha Hai — Somo la 1</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#64abd9; }
    #stage { position:fixed; inset:0; overflow:hidden; background:#64abd9; }
    .layer { position:absolute; left:0; right:0; background-repeat:repeat-x; background-position:left bottom; image-rendering:pixelated; }
    #far    { background-image:url(assets/scene/far.png); }
    #ground { bottom:0; background-image:url(assets/scene/ground.png); }
    .actor { position:absolute; image-rendering:pixelated; user-select:none; -webkit-user-drag:none; }
    #hero { transform:scaleX(-1); }

    .topbar { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; z-index:6; gap:8px; }
    .pill { color:#fff; background:rgba(20,30,25,.55); border-radius:999px; padding:6px 14px; font-size:.85rem; text-decoration:none; font-family:var(--font-body, system-ui, sans-serif); border:none; cursor:pointer; }
    .switcher { display:flex; background:rgba(20,30,25,.55); border-radius:999px; padding:3px; gap:2px; }
    .switcher button { border:none; background:transparent; color:#fff; padding:4px 12px; border-radius:999px; font-size:.8rem; cursor:pointer; font-family:inherit; }
    .switcher button.active { background:#fff; color:#2C4A3E; font-weight:600; }
    .progress { position:absolute; top:52px; left:50%; transform:translateX(-50%); width:min(360px,60vw); height:6px; background:rgba(20,30,25,.35); border-radius:3px; z-index:6; overflow:hidden; }
    .progress > i { display:block; height:100%; width:0; background:#F7F3EC; transition:width .3s; }

    #bubble { position:absolute; top:72px; left:50%; transform:translateX(-50%); width:min(600px, calc(100vw - 24px)); box-sizing:border-box;
              background:rgba(24,34,29,.86); color:#F7F3EC; border-radius:18px; padding:14px 16px; display:flex; gap:14px; align-items:center;
              box-shadow:0 8px 32px rgba(0,0,0,.35); z-index:5; font-family:var(--font-body, system-ui, sans-serif); border:3px solid transparent; }
    #bubble.you { border-color:#E8A882; }
    #portrait { image-rendering:pixelated; flex:none; width:72px; height:72px; border-radius:10px; background:rgba(255,255,255,.08); }
    #portrait[hidden] { display:none; }
    #bubble .body { flex:1; min-width:0; }
    #who { font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; opacity:.8; margin-bottom:2px; }
    #main { font-family:var(--font-display, Georgia, serif); font-size:clamp(1.25rem,3.4vw,1.8rem); line-height:1.25; font-weight:600; margin:0; color:#F7F3EC; word-wrap:break-word; }
    #main.plain { font-family:var(--font-body, system-ui, sans-serif); font-size:clamp(1.05rem,2.6vw,1.3rem); font-weight:500; }
    #gloss { margin:4px 0 0; font-size:.95rem; opacity:.85; color:#F7F3EC; line-height:1.4; }
    #instr { margin:6px 0 0; font-size:.85rem; color:#E8A882; line-height:1.4; }
    .row { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
    .speak { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; border:2px solid rgba(247,243,236,.5); background:transparent; color:#F7F3EC; cursor:pointer; flex:none; }
    .speak[hidden] { display:none; }
    .speak:hover, .speak.playing { background:#F7F3EC; color:#2C4A3E; }
    .speak svg { width:22px; height:22px; fill:currentColor; }
    .speak.rec { border-color:#E8A882; }
    .speak.recording { background:#C0392B; border-color:#C0392B; color:#fff; animation:pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(192,57,43,.35); } }
    #priv { margin:4px 0 0; font-size:.75rem; opacity:.7; color:#F7F3EC; }
    .btn { background:#C4714A; color:#fff; border:none; border-radius:999px; padding:.65rem 1.6rem; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn:hover { background:#b05e38; }
    .btn.ghost { background:transparent; border:2px solid rgba(247,243,236,.5); }

    #end { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:56px 16px 16px; box-sizing:border-box; z-index:7; }
    #end.active { display:flex; }
    #end .plate { max-width:560px; width:100%; background:rgba(24,34,29,.88); color:#F7F3EC; border-radius:18px; padding:clamp(16px,3vw,28px); text-align:center; box-shadow:0 8px 32px rgba(0,0,0,.35); font-family:var(--font-body, system-ui, sans-serif); }
    #end h1 { color:#F7F3EC; margin:0 0 .5em; font-family:var(--font-display, Georgia, serif); font-size:clamp(1.3rem,3.2vw,1.8rem); }
    #end p { color:#F7F3EC; margin:0 0 1.2em; font-size:1.05rem; line-height:1.6; }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

    #ex { position:absolute; top:72px; left:50%; transform:translateX(-50%); width:min(640px, calc(100vw - 24px)); max-height:calc(100vh - 88px); overflow:auto; box-sizing:border-box;
          background:rgba(24,34,29,.9); color:#F7F3EC; border-radius:18px; padding:16px; z-index:5; display:none; box-shadow:0 8px 32px rgba(0,0,0,.35); font-family:var(--font-body, system-ui, sans-serif); }
    #ex.active { display:block; }
    [hidden] { display:none !important; }
    #ex p { color:#F7F3EC; }
    #ex-title { font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; opacity:.8; margin:0 0 8px; }
    #ex-prompt { display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0 14px; text-align:center; flex-wrap:wrap; }
    #ex-prompt .big { font-family:var(--font-display, Georgia, serif); font-size:clamp(1.3rem,3.6vw,1.9rem); font-weight:600; color:#F7F3EC; line-height:1.25; }
    .tag { font-size:.68rem; background:rgba(232,168,130,.25); color:#E8A882; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle; font-family:var(--font-body, system-ui, sans-serif); font-weight:500; }
    .speak[disabled] { opacity:.35; cursor:not-allowed; }
    .opts { display:grid; grid-template-columns:1fr; gap:8px; }
    @media (min-width:560px) { .opts.two { grid-template-columns:1fr 1fr; } }
    .opt { display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; color:#F7F3EC; background:rgba(255,255,255,.08); border:2px solid rgba(247,243,236,.3); border-radius:12px; padding:.7rem 1rem; font-size:1rem; line-height:1.35; cursor:pointer; font-family:inherit; }
    .opt:hover:not([disabled]) { background:rgba(255,255,255,.16); }
    .opt.good { background:rgba(80,170,110,.35); border-color:#6fcf97; }
    .opt.bad  { background:rgba(200,70,60,.35); border-color:#eb5757; }
    .opt[disabled] { cursor:default; }
    .opt .mini { flex:none; width:34px; height:34px; border-radius:50%; border:2px solid rgba(247,243,236,.5); display:inline-flex; align-items:center; justify-content:center; background:transparent; color:#F7F3EC; cursor:pointer; padding:0; }
    .opt .mini svg { width:16px; height:16px; fill:currentColor; }
    .opt .mini[disabled] { opacity:.35; cursor:not-allowed; }
    .opt.sel { border-color:#E8A882; background:rgba(232,168,130,.2); }
    .opt.done { opacity:.4; }
    #ex-fb { min-height:1.4em; margin:12px 0 0; font-size:1rem; font-weight:600; color:#F7F3EC; }
    #ex-fb.good { color:#6fcf97; } #ex-fb.bad { color:#ffb4a8; }
    #ex-next { margin-top:10px; }
    @media (max-height:460px) {
      #bubble { top:60px; padding:10px 12px; gap:10px; }
      #portrait { width:54px; height:54px; }
      .row { margin-top:6px; }
      .progress { top:46px; }
    }
  </style>
</head>
<body>
<div id="stage">
  <div id="far" class="layer"></div>
  <div id="ground" class="layer"></div>
  <img id="anna" class="actor" alt="" src="assets/anna/idle0.png" />
  <img id="hero" class="actor" alt="" src="assets/hero_f/idle0.png" />

  <div class="topbar">
    <a class="pill" id="backLink" href="../language.html"></a>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="pill" id="restart" type="button"></button>
      <div class="switcher"><button id="btn-sw" type="button">SW</button><button id="btn-en" type="button">EN</button></div>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>

  <div id="bubble">
    <img id="portrait" alt="" src="assets/anna_face/smile.png" />
    <div class="body">
      <div id="who"></div>
      <p id="main"></p>
      <p id="gloss"></p>
      <p id="instr"></p>
      <div class="row">
        <button class="speak" id="b-audio" type="button" hidden aria-label="Listen">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        </button>
        <button class="speak rec" id="b-rec" type="button" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button class="speak rec" id="b-mine" type="button" hidden>
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" id="next" type="button"></button>
      </div>
      <p id="priv" hidden></p>
    </div>
  </div>

  <div id="ex">
    <p id="ex-title"></p>
    <div id="ex-prompt"></div>
    <div class="opts" id="ex-opts"></div>
    <p id="ex-fb"></p>
    <div style="text-align:center"><button class="btn" id="ex-next" type="button" hidden></button></div>
  </div>

  <div id="end">
    <div class="plate">
      <h1 id="e-title"></h1>
      <p id="e-text"></p>
      <div class="actions"><button class="btn" id="e-village" type="button"></button><button class="btn ghost" id="e-again" type="button"></button></div>
    </div>
  </div>
</div>

<script>
  // ---------- настройки ----------
  const SB_URL = 'https://geogbanccumdcaymhkdb.supabase.co'
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlb2diYW5jY3VtZGNheW1oa2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MDk4MjgsImV4cCI6MjA5MTk4NTgyOH0.BL1np5CpfddNE_S7x_bmHBqTHG-L7xn8PE5Jk3XIUx0'
  const TOPIC = 'communication'
  let EXTRA = []                // дополнительные фразы темы: варианты-обманки
  const TOPIC_JSON = '../data/topics/a1/vocabulary/communication.json'
  const SPR = { w: 72, h: 96 }, SKY_H = 170, GROUND_H = 27, FEET_IN_GROUND = 8

  // Сценарий урока 1. who: 'anna' | 'you'. id: номер фразы в теме «communication».
  // Нет записи в базе: показываем текст на SW/EN из файла темы. Есть запись: показываем и озвучиваем кикурья.
  const LESSON = [
    { who: 'anna', id: 'gr1', anim: 'wave' },
    { who: 'you',  id: 'gr1' },
    { who: 'anna', id: 'in3' },
    { who: 'you',  id: 'in4' },
    { who: 'anna', id: 'in4' },
    { who: 'anna', id: 'in6' },
    { who: 'anna', id: 'in5' },
    { who: 'you',  id: 'in6', withName: true },
    { who: 'anna', id: 'gr8', anim: 'wave' },
    { who: 'anna', id: 'wy6' },
    { who: 'anna', say: { sw: 'Ili kuendelea, lazima ukariri maneno haya. Sasa tutafanya mazoezi.', en: 'To go on, you need to memorise these words. Now we will practise.' } }
  ]

  const i18n = {
    sw: { back: '← Rudi', restart: 'Anza upya', you: 'Wewe', next: 'Endelea', said: 'Nimesema',
          instr: 'Zamu yako: sema, rekodi, kisha sikiliza na ulinganishe na mfano. Umesema sawa?',
          priv: 'Rekodi yako inabaki kwenye kifaa chako tu.', rec: 'Rekodi sauti yako', stop: 'Simamisha', mine: 'Sikiliza rekodi yako',
          mic_err: 'Kipaza sauti hakipatikani. Ruhusu matumizi ya kipaza sauti kwenye kivinjari.',
          e_title: 'Hongera!', e_text: 'Umefanya vizuri! Sasa uko tayari kuingia kijijini.', e_village: 'Ingia kijijini', e_soon: 'Kijiji kinakuja hivi karibuni.', e_again: 'Anza somo upya', listen: 'Sikiliza',
          x_listen: 'Sikiliza na uchague maana', x_read: 'Soma na uchague maana', x_pick: 'Chagua neno sahihi kwa maana hii', x_reply: 'Anna anasema hivi. Chagua jibu sahihi.', x_match: 'Unganisha kila neno na maana yake',
          good: 'Sahihi!', bad: 'Jibu sahihi ni:', sample: 'mfano', cont: 'Endelea', noaudio: 'Bado hakuna sauti' },
    en: { back: '← Back', restart: 'Start over', you: 'You', next: 'Continue', said: 'I said it',
          instr: 'Your turn: say it, record yourself, then compare with the example. Did you say it right?',
          priv: 'Your recording stays on your device only.', rec: 'Record yourself', stop: 'Stop', mine: 'Play your recording',
          mic_err: 'The microphone is not available. Allow microphone access in your browser.',
          e_title: 'Well done!', e_text: 'You did great! Now you are ready to enter the village.', e_village: 'Enter the village', e_soon: 'The village is coming soon.', e_again: 'Start the lesson again', listen: 'Listen',
          x_listen: 'Listen and choose the meaning', x_read: 'Read and choose the meaning', x_pick: 'Choose the right word for this meaning', x_reply: 'Anna says this. Choose the right reply.', x_match: 'Match each word with its meaning',
          good: 'Correct!', bad: 'The right answer is:', sample: 'sample', cont: 'Continue', noaudio: 'No audio yet' }
  }

  // ---------- состояние ----------
  const $ = id => document.getElementById(id)
  const params = new URLSearchParams(location.search)
  const langId = params.get('id') || 'kikurya'
  let lang = localStorage.getItem('lh_lang') || 'sw'
  if (!i18n[lang]) lang = 'sw'
  let P = null                // профиль ученика
  let texts = {}              // id -> { sw, en } из файла темы
  let rows = {}               // 'anna|id' / 'you|id' -> строка из базы
  let idx = 0, ended = false
  let s = 3                   // масштаб пикселей

  const progressKey = () => 'lh_lesson1_' + langId
  function loadProfile() { try { const j = JSON.parse(localStorage.getItem('lh_profile') || 'null'); return j && j.name ? j : null } catch (e) { return null } }

  // ---------- база ----------
  async function resolvePhrases(language, topic, ids, hero) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000)
    try {
      const res = await fetch(SB_URL + '/rest/v1/rpc/resolve_phrases', {
        method: 'POST', signal: ctl.signal,
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_language: language, p_topic: topic, p_phrase_ids: ids, p_hero: hero || null })
      })
      if (!res.ok) return []
      const out = await res.json()
      return Array.isArray(out) ? out : []
    } catch (e) { return [] } finally { clearTimeout(timer) }
  }
  function collectTexts(o) {
    if (Array.isArray(o)) o.forEach(collectTexts)
    else if (o && typeof o === 'object') {
      if (o.id && (o.sw || o.en)) texts[o.id] = { sw: o.sw || '', en: o.en || '' }
      Object.values(o).forEach(collectTexts)
    }
  }
  async function loadAll() {
    try { const r = await fetch(TOPIC_JSON); collectTexts(await r.json()) } catch (e) {}
    const ids = a => [...new Set(LESSON.filter(l => l.who === a && l.id).map(l => l.id))]
    EXTRA = Object.keys(texts).filter(i => !PRACTICE.includes(i)).slice(0, 14)
    const poolIds = [...new Set([...PRACTICE, ...EXTRA])]
    const [ra, ry, rp] = await Promise.all([
      resolvePhrases(langId, TOPIC, ids('anna'), 'anna'),
      resolvePhrases(langId, TOPIC, ids('you'), null),
      resolvePhrases(langId, TOPIC, poolIds, null)
    ])
    rp.forEach(r => rows['pool|' + r.phrase_id] = r)
    ra.forEach(r => rows['anna|' + r.phrase_id] = r)
    ry.forEach(r => rows['you|' + r.phrase_id] = r)
  }

  // ---------- сцена ----------
  function layout() {
    // масштаб: герои не выше ~42% экрана и оба помещаются по ширине
    s = Math.max(1, Math.min(4, Math.floor(innerHeight * 0.42 / SPR.h), Math.floor(innerWidth / 180)))
    const far = $('far'), gr = $('ground')
    far.style.height = SKY_H * s + 'px'; far.style.bottom = GROUND_H * s + 'px'; far.style.backgroundSize = 'auto 100%'
    gr.style.height = GROUND_H * s + 'px'; gr.style.backgroundSize = 'auto 100%'
    const bottom = (GROUND_H - FEET_IN_GROUND) * s
    for (const [id, dx] of [['anna', -50], ['hero', 50]]) {
      const el = $(id)
      el.style.width = SPR.w * s + 'px'; el.style.height = SPR.h * s + 'px'
      el.style.bottom = bottom + 'px'; el.style.left = `calc(50% + ${dx * s}px - ${SPR.w * s / 2}px)`
    }
    const pw = innerHeight < 460 ? 54 : 72
    $('portrait').style.width = $('portrait').style.height = (innerHeight >= 600 ? 96 : pw) + 'px'
  }

  // Анимация героев: дыхание и моргание; «wave» по команде
  const folders = { anna: 'assets/anna/', hero: null }
  function setSprite(who, frame) { const el = $(who); el.src = (who === 'anna' ? 'assets/anna/' : 'assets/' + (P && P.gender === 'm' ? 'hero_m/' : 'hero_f/')) + frame + '.png' }
  let waving = {}
  function wave(who, ms = 1800) {
    waving[who] = true; let k = 0
    const t = setInterval(() => setSprite(who, k++ % 2 ? 'wave1' : 'wave0'), 260)
    setTimeout(() => { clearInterval(t); waving[who] = false; setSprite(who, 'idle0') }, ms)
  }
  function idleLoop(who, offset) {
    let breath = false
    setInterval(() => { if (waving[who]) return; breath = !breath; setSprite(who, breath ? 'breath' : 'idle0') }, 700 + offset)
    ;(function blink() {
      setTimeout(() => { if (!waving[who]) { setSprite(who, 'blink'); setTimeout(() => { if (!waving[who]) setSprite(who, 'idle0') }, 140) } blink() }, 2200 + Math.random() * 2500)
    })()
  }

  // ---------- звук и мимика Анны ----------
  let audio = null, talkTimer = null
  function setFace(name) { $('portrait').src = 'assets/anna_face/' + name + '.png' }
  function stopAudio() { if (audio) { audio.pause(); audio = null } clearInterval(talkTimer); $('b-audio').classList.remove('playing'); if (!$('portrait').hidden) setFace('smile') }
  function play(url, talking) {
    stopAudio()
    if (!url) return
    try {
      audio = new Audio(url)
      $('b-audio').classList.add('playing')
      if (talking) { let k = 0; talkTimer = setInterval(() => setFace(k++ % 2 ? 'talk1' : 'talk2'), 140) }
      const done = () => stopAudio()
      audio.onended = done; audio.onerror = done
      audio.play().catch(done)
    } catch (e) { stopAudio() }
  }

  // ---------- запись ученика (остаётся на устройстве, никуда не отправляется) ----------
  let rec = null, recStream = null, recChunks = [], mineUrl = null, mineAudio = null, recTimer = null
  const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)
  function clearMine() {
    stopRecording(true)
    if (mineAudio) { mineAudio.pause(); mineAudio = null }
    if (mineUrl) { URL.revokeObjectURL(mineUrl); mineUrl = null }
    $('b-mine').hidden = true; $('b-mine').classList.remove('playing')
  }
  function stopRecording(discard) {
    clearTimeout(recTimer)
    if (rec && rec.state !== 'inactive') { rec._discard = !!discard; try { rec.stop() } catch (e) {} }
    else if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null }
    $('b-rec').classList.remove('recording')
  }
  async function toggleRecording() {
    const L = i18n[lang]
    if (rec && rec.state === 'recording') { stopRecording(false); return }
    clearMine(); stopAudio()
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true })
      recChunks = []
      rec = new MediaRecorder(recStream)
      rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data) }
      rec.onstop = () => {
        if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null }
        $('b-rec').classList.remove('recording'); $('b-rec').setAttribute('aria-label', L.rec)
        if (rec._discard || !recChunks.length) return
        mineUrl = URL.createObjectURL(new Blob(recChunks, { type: rec.mimeType || 'audio/webm' }))
        $('b-mine').hidden = false
      }
      rec.start()
      $('b-rec').classList.add('recording'); $('b-rec').setAttribute('aria-label', L.stop)
      recTimer = setTimeout(() => stopRecording(false), 15000)       // не дольше 15 секунд
    } catch (e) {
      $('instr').textContent = L.mic_err
    }
  }
  function playMine() {
    if (!mineUrl) return
    stopAudio()
    if (mineAudio) mineAudio.pause()
    mineAudio = new Audio(mineUrl)
    const b = $('b-mine'); b.classList.add('playing')
    mineAudio.onended = mineAudio.onerror = () => b.classList.remove('playing')
    mineAudio.play().catch(() => b.classList.remove('playing'))
  }

  // ---------- реплики ----------
  function currentText(line) {
    const L = i18n[lang]
    if (line.say) return { main: line.say[lang], gloss: '', audio: null, recorded: false }
    const row = rows[line.who + '|' + line.id]
    const tx = texts[line.id] || { sw: line.id, en: line.id }
    if (row && row.text_value) {
      let main = row.text_value
      if (line.withName && P) main = main.replace(/Anna/g, P.name)
      let gloss = tx[lang]
      if (line.withName && P) gloss = gloss.replace(/Anna/g, P.name)
      return { main, gloss, audio: row.audio_url || null, recorded: true }
    }
    let main = tx[lang]
    if (line.withName && P) main = main.replace(/Anna/g, P.name)
    return { main, gloss: '', audio: null, recorded: false }
  }

  function showLine() {
    const L = i18n[lang], line = LESSON[idx]
    stopAudio(); clearMine()
    const you = line.who === 'you', t = currentText(line)
    $('bubble').classList.toggle('you', you)
    $('portrait').hidden = you
    if (!you) setFace('smile')
    $('who').textContent = you ? (P ? P.name : L.you) : 'Anna'
    $('main').textContent = t.main
    $('main').classList.toggle('plain', !t.recorded)
    $('gloss').textContent = t.gloss
    $('gloss').hidden = !t.gloss
    $('instr').textContent = you ? L.instr : ''
    $('instr').hidden = !you
    $('b-rec').hidden = !(you && canRecord); $('priv').hidden = !(you && canRecord); $('priv').textContent = L.priv
    $('b-rec').setAttribute('aria-label', L.rec); $('b-mine').setAttribute('aria-label', L.mine)
    $('b-audio').hidden = !t.audio
    $('next').textContent = you ? L.said : L.next
    $('bar').style.width = (idx / LESSON.length * 100) + '%'
    if (line.anim === 'wave' && !you) wave('anna')
    if (!you && t.audio) setTimeout(() => { if (LESSON[idx] === line) play(t.audio, true) }, 350)
    try { localStorage.setItem(progressKey(), String(idx)) } catch (e) {}
  }

  function next() {
    if (idx < LESSON.length - 1) { idx++; showLine() } else finish()
  }
  function finish() { stopAudio(); clearMine(); startPractice() }
  function again() {
    ended = false; practicing = false; idx = 0; streak = {}; matchDone = false
    try { localStorage.removeItem(practiceKey()) } catch (e) {}
    $('end').classList.remove('active'); $('ex').classList.remove('active'); $('bubble').style.display = 'flex'; showLine()
  }

  function renderStatic() {
    const L = i18n[lang]
    document.documentElement.lang = lang
    $('btn-sw').classList.toggle('active', lang === 'sw'); $('btn-en').classList.toggle('active', lang === 'en')
    $('backLink').textContent = L.back; $('restart').textContent = L.restart
    $('b-audio').setAttribute('aria-label', L.listen)
    $('e-title').textContent = L.e_title; $('e-text').textContent = L.e_text; $('e-again').textContent = L.e_again; $('e-village').textContent = L.e_village; $('e-village').hidden = false
    if (practicing && exState) { if (exState.type === 'match') renderMatch(); else renderChoice(exState.id, exState.type) }
    else if (!ended) showLine()
  }
  function setLang(l) { lang = l; try { localStorage.setItem('lh_lang', l) } catch (e) {} renderStatic() }

  // ---------- упражнения ----------
  const PRACTICE = ['gr1', 'in3', 'in4', 'in5', 'in6', 'gr8', 'wy6']      // что учим в уроке 1
  const ANSWER_OF = { gr1: 'gr1', in4: 'in3', in6: 'in5' }               // на какую фразу Анны это ответ
  const NEED = 2                                                           // сколько раз подряд верно
  let streak = {}, lastTypes = [], matchDone = false, exState = null, practicing = false
  const practiceKey = () => 'lh_practice1_' + langId
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
  const ICON = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>'

  // Данные фразы. Нет записи в базе: слово на языке заменяет заглушка (текст на другом языке интерфейса) с пометкой «образец».
  function info(id) {
    const r = rows['pool|' + id], tx = texts[id] || { sw: id, en: id }
    const gloss = tx[lang], other = tx[lang === 'sw' ? 'en' : 'sw']
    return { id, gloss, tribal: (r && r.text_value) || other, stub: !(r && r.text_value), audio: (r && r.audio_url) || null }
  }
  function loadStreak() { try { streak = JSON.parse(localStorage.getItem(practiceKey()) || '{}') || {} } catch (e) { streak = {} } PRACTICE.forEach(i => { if (typeof streak[i] !== 'number') streak[i] = 0 }) }
  function saveStreak() { try { localStorage.setItem(practiceKey(), JSON.stringify(streak)) } catch (e) {} }
  const score = () => PRACTICE.reduce((a, i) => a + Math.min(streak[i], NEED), 0)
  const allDone = () => PRACTICE.every(i => streak[i] >= NEED)

  function miniBtn(d, small) {
    const b = el('button', small ? 'mini' : 'speak'); b.type = 'button'; b.innerHTML = ICON
    if (!d.audio) { b.disabled = true; b.title = i18n[lang].noaudio } else b.onclick = e => { e.stopPropagation(); play(d.audio, false) }
    return b
  }
  function tribalNode(d, cls) {
    const w = el('span', cls || 'big', d.tribal)
    if (d.stub) w.appendChild(el('span', 'tag', i18n[lang].sample))
    return w
  }
  function distractors(id, n, sameStub) {
    const t = info(id), pool = [...new Set([...PRACTICE, ...EXTRA])].filter(x => x !== id)
    const ok = pool.map(info).filter(d => d.gloss !== t.gloss && d.tribal !== t.tribal && (sameStub === undefined || d.stub === sameStub))
    return shuffle(ok).slice(0, n)
  }
  function chooseType(id) {
    const base = streak[id] === 0 ? ['listen', 'read'] : ['pick', 'reply', 'read', 'listen']
    let ts = base.filter(t => t !== 'reply' || ANSWER_OF[id])
    const fresh = ts.filter(t => !lastTypes.slice(-2).includes(t))
    ts = fresh.length ? fresh : ts
    return ts[Math.floor(Math.random() * ts.length)]
  }
  function nextExercise() {
    if (allDone()) return finishPractice()
    $('bar').style.width = (score() / (PRACTICE.length * NEED) * 100) + '%'
    if (!matchDone && score() >= PRACTICE.length * NEED / 2 && PRACTICE.length >= 4) { matchDone = true; return renderMatch() }
    const open = PRACTICE.filter(i => streak[i] < NEED)
    const min = Math.min(...open.map(i => streak[i]))
    let cands = open.filter(i => streak[i] === min && i !== (exState && exState.id))
    if (!cands.length) cands = open
    const id = cands[Math.floor(Math.random() * cands.length)], type = chooseType(id)
    lastTypes.push(type)
    renderChoice(id, type)
  }

  function shell(titleKey) {
    const L = i18n[lang]
    $('ex-title').textContent = L[titleKey]; $('ex-prompt').innerHTML = ''; $('ex-opts').innerHTML = ''
    $('ex-fb').textContent = ''; $('ex-fb').className = ''; $('ex-next').hidden = true; $('ex-next').textContent = L.cont
    $('ex').classList.add('active'); stopAudio()
  }
  function answer(id, ok, correctText, correctAudio) {
    const L = i18n[lang]
    streak[id] = ok ? streak[id] + 1 : 0; saveStreak()
    $('ex-fb').className = ok ? 'good' : 'bad'
    $('ex-fb').textContent = ok ? L.good : L.bad + ' ' + correctText
    if (!ok && correctAudio) play(correctAudio, false)
    $('bar').style.width = (score() / (PRACTICE.length * NEED) * 100) + '%'
    $('ex-next').hidden = false
    if (ok) wave('anna', 900)
  }

  function renderChoice(id, type) {
    const L = i18n[lang], t = info(id)
    exState = { id, type }
    shell({ listen: 'x_listen', read: 'x_read', pick: 'x_pick', reply: 'x_reply' }[type])
    const prompt = $('ex-prompt'), opts = $('ex-opts')
    let options, correct, kind                       // kind: 'gloss' варианты — переводы, 'tribal' — слова
    if (type === 'listen') {
      prompt.appendChild(miniBtn(t, false))
      if (t.stub || !t.audio) prompt.appendChild(tribalNode(t))
      kind = 'gloss'
    } else if (type === 'read') {
      prompt.appendChild(tribalNode(t)); prompt.appendChild(miniBtn(t, false)); kind = 'gloss'
    } else if (type === 'pick') {
      prompt.appendChild(el('span', 'big', t.gloss)); kind = 'tribal'
    } else {                                          // reply: Анна говорит вопрос, ученик выбирает ответ
      const q = info(ANSWER_OF[id]); prompt.appendChild(tribalNode(q)); prompt.appendChild(miniBtn(q, false)); kind = 'tribal'
    }
    options = shuffle([t, ...distractors(id, 3, kind === 'tribal' ? t.stub : undefined)])
    if (type === 'listen' && !t.stub && t.audio) setTimeout(() => { if (exState && exState.id === id) play(t.audio, false) }, 350)
    options.forEach(d => {
      const b = el('button', 'opt'); b.type = 'button'
      if (kind === 'gloss') b.appendChild(el('span', '', d.gloss))
      else { b.appendChild(tribalNode(d, '')); b.appendChild(miniBtn(d, true)) }
      b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x => x.disabled = true)
        const ok = d.id === id
        b.classList.add(ok ? 'good' : 'bad')
        if (!ok) [...opts.children].forEach((x, i) => { if (options[i].id === id) x.classList.add('good') })
        answer(id, ok, kind === 'gloss' ? t.gloss : t.tribal, kind === 'tribal' ? t.audio : null)
      }
      opts.appendChild(b)
    })
    opts.classList.toggle('two', kind === 'gloss')
    $('ex-next').onclick = nextExercise
  }

  function renderMatch() {
    const L = i18n[lang]
    const ids = PRACTICE.slice().sort((a, b) => streak[a] - streak[b]).slice(0, 4)
    exState = { id: null, type: 'match' }
    shell('x_match')
    const items = ids.map(info), opts = $('ex-opts'); opts.classList.add('two')
    const left = shuffle(items), right = shuffle(items)
    let sel = null, solved = 0, missed = {}
    const mk = (d, side) => {
      const b = el('button', 'opt'); b.type = 'button'
      if (side === 'l') { b.appendChild(tribalNode(d, '')); b.appendChild(miniBtn(d, true)) } else b.appendChild(el('span', '', d.gloss))
      b.onclick = () => {
        if (b.classList.contains('done')) return
        if (side === 'l') { opts.querySelectorAll('.opt.sel').forEach(x => x.classList.remove('sel')); sel = { d, b }; b.classList.add('sel'); if (d.audio) play(d.audio, false); return }
        if (!sel) return
        if (sel.d.id === d.id) {
          sel.b.classList.remove('sel'); sel.b.classList.add('done'); b.classList.add('done'); solved++; sel = null
          if (solved === items.length) {
            items.forEach(x => { streak[x.id] = missed[x.id] ? 0 : streak[x.id] + 1 })
            saveStreak(); $('ex-fb').className = 'good'; $('ex-fb').textContent = L.good; $('ex-next').hidden = false
            $('bar').style.width = (score() / (PRACTICE.length * NEED) * 100) + '%'; wave('anna', 900)
          }
        } else { missed[sel.d.id] = true; b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 500) }
      }
      return b
    }
    // две колонки: слова слева, значения справа (по строкам)
    for (let i = 0; i < items.length; i++) { opts.appendChild(mk(left[i], 'l')); opts.appendChild(mk(right[i], 'r')) }
    $('ex-next').onclick = nextExercise
  }

  function startPractice() {
    $('bubble').style.display = 'none'; practicing = true; loadStreak(); matchDone = score() >= PRACTICE.length * NEED / 2
    if (allDone()) return finishPractice()
    nextExercise()
  }
  function finishPractice() {
    $('ex').classList.remove('active'); stopAudio(); ended = true; practicing = false
    $('bar').style.width = '100%'; $('e-text').textContent = i18n[lang].e_text
    $('end').classList.add('active'); wave('anna'); wave('hero')
    try { localStorage.setItem(progressKey(), 'done') } catch (e) {}
  }

  // ---------- запуск ----------
  $('btn-sw').onclick = () => setLang('sw'); $('btn-en').onclick = () => setLang('en')
  $('next').onclick = next
  $('b-rec').onclick = toggleRecording
  $('b-mine').onclick = playMine
  $('b-audio').onclick = () => { const t = currentText(LESSON[idx]); play(t.audio, LESSON[idx].who === 'anna') }
  $('e-again').onclick = again
  $('e-village').onclick = () => { $('e-text').textContent = i18n[lang].e_soon; $('e-village').hidden = true }
  $('restart').onclick = () => {
    try { localStorage.removeItem('lh_profile'); localStorage.removeItem(progressKey()); localStorage.removeItem(practiceKey()) } catch (e) {}
    location.href = 'index.html?id=' + encodeURIComponent(langId)
  }
  addEventListener('resize', layout)

  async function init() {
    P = loadProfile()
    if (!P) { location.replace('index.html?id=' + encodeURIComponent(langId)); return }
    $('backLink').href = '../language.html?id=' + encodeURIComponent(langId)
    setSprite('anna', 'idle0'); setSprite('hero', 'idle0')
    layout(); idleLoop('anna', 0); idleLoop('hero', 130)
    renderStatic()                        // сразу показываем первую реплику на SW/EN, пока грузится база
    await loadAll()
    const saved = parseInt(localStorage.getItem(progressKey()) || '0', 10)
    idx = isNaN(saved) || saved >= LESSON.length ? 0 : saved
    loadStreak()
    if (localStorage.getItem(progressKey()) === 'done' && allDone()) { startPractice(); return }   // всё пройдено: сразу финальный экран
    if (score() > 0) { startPractice(); return }                                                    // практика уже начата
    showLine()
  }
  init()
</script>
</body>
</html>
