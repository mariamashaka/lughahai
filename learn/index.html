<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lugha Hai — Jifunza</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#5ca0d8; }
    #stage { position:fixed; inset:0; overflow:hidden; }
    #scene { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
             image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:pixelated;
             max-width:none; user-select:none; -webkit-user-drag:none; }
    #veil  { position:absolute; inset:0; background:rgba(255,255,255,var(--haze,0.12)); pointer-events:none; }

    .topbar { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; z-index:5; }
    .back { color:#fff; background:rgba(20,30,25,.55); border-radius:999px; padding:6px 14px; font-size:.85rem; text-decoration:none; font-family:var(--font-body, system-ui, sans-serif); }
    .switcher { display:flex; background:rgba(20,30,25,.55); border-radius:999px; padding:3px; gap:2px; }
    .switcher button { border:none; background:transparent; color:#fff; padding:4px 12px; border-radius:999px; font-size:.8rem; cursor:pointer; font-family:inherit; }
    .switcher button.active { background:#fff; color:#2C4A3E; font-weight:600; }

    .screen { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:56px 16px 16px; box-sizing:border-box; z-index:4; }
    .screen.active { display:flex; }
    .plate { max-width:640px; width:100%; max-height:100%; overflow:auto; box-sizing:border-box;
             background:rgba(24,34,29,.78); color:#F7F3EC; border-radius:18px; padding:clamp(16px,3vw,28px);
             box-shadow:0 8px 32px rgba(0,0,0,.35); text-align:center; font-family:var(--font-body, system-ui, sans-serif); }
    .plate h1 { color:#F7F3EC; margin:0 0 .6em; font-family:var(--font-display, Georgia, serif); font-size:clamp(1.3rem,3.2vw,1.9rem); font-weight:600; }
    .plate p  { color:#F7F3EC; margin:0 0 1.2em; font-size:clamp(.95rem,2.2vw,1.1rem); line-height:1.65; }
    .btn { background:#C4714A; color:#fff; border:none; border-radius:999px; padding:.8rem 2.2rem; font-size:1.05rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn:hover { background:#b05e38; }

    .speak { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; margin:0 0 .8em; border-radius:50%; border:2px solid rgba(247,243,236,.5); background:transparent; color:#F7F3EC; cursor:pointer; }
    .speak[hidden] { display:none; }
    .speak:hover, .speak.playing { background:#F7F3EC; color:#2C4A3E; }
    .speak svg { width:22px; height:22px; fill:currentColor; }
    .plate.wide { max-width:860px; text-align:left; max-height:calc(100vh - 70px); overflow-y:auto; }
    .plate .hint { font-size:.8rem; line-height:1.4; margin:6px 0 0; }
    .plate .note { font-size:.9rem; line-height:1.5; }
    .plate .chip { font-size:.95rem; }
    .plate.wide h1 { text-align:center; }
    .grid2 { display:grid; grid-template-columns:1fr; gap:16px 28px; margin-bottom:1.2em; }
    @media (min-width:720px) { .grid2 { grid-template-columns:1fr 1fr; } }
    .field > label, .field > .lbl { display:block; font-size:.9rem; font-weight:600; margin-bottom:8px; color:#F7F3EC; }
    .hint { font-size:.8rem; opacity:.85; margin:6px 0 0; line-height:1.4; color:#F7F3EC; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { border:2px solid rgba(247,243,236,.35); background:transparent; color:#F7F3EC; border-radius:999px; padding:.45rem 1rem; font-size:.95rem; cursor:pointer; font-family:inherit; }
    .chip.sel { background:#F7F3EC; color:#2C4A3E; border-color:#F7F3EC; font-weight:600; }
    .txt { width:100%; box-sizing:border-box; border-radius:10px; border:2px solid rgba(247,243,236,.35); background:rgba(255,255,255,.1); color:#fff; padding:.6rem .8rem; font-size:1rem; font-family:inherit; }
    .txt::placeholder { color:rgba(247,243,236,.55); }
    .reasons { display:flex; flex-direction:column; gap:8px; }
    .reason { text-align:left; border-radius:12px; line-height:1.4; padding:.7rem 1rem; }
    .note { margin:8px 0 0; padding:.6rem .8rem; border-left:3px solid #E8A882; background:rgba(255,255,255,.08); border-radius:6px; font-size:.9rem; line-height:1.5; color:#F7F3EC; }
    .actions { display:flex; gap:10px; justify-content:center; margin-top:.4em; flex-wrap:wrap; }
    .btn.ghost { background:transparent; border:2px solid rgba(247,243,236,.5); }
    .btn[disabled] { opacity:.4; cursor:not-allowed; }
    .looks { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:0 0 1.2em; }
    .look { width:150px; border:3px solid rgba(247,243,236,.3); border-radius:14px; background:rgba(255,255,255,.08); padding:10px 8px 12px; cursor:pointer; color:#F7F3EC; font-family:inherit; }
    .look.sel { border-color:#E8A882; background:rgba(232,168,130,.18); }
    .look[disabled] { cursor:not-allowed; opacity:.65; }
    .look .pic { height:192px; display:flex; align-items:center; justify-content:center; }
    .look img { image-rendering:pixelated; width:144px; height:192px; }
    .look .q { font-size:4rem; font-weight:700; opacity:.7; }
    .look .cap { font-size:.8rem; margin-top:6px; line-height:1.3; }
    .look .soon { display:block; font-size:.72rem; opacity:.8; margin-top:2px; }
    @media (max-height:520px) { .look .pic { height:96px; } .look img { width:72px; height:96px; } .look { width:110px; } .look .q { font-size:2.4rem; } }
    @media (max-height:420px) { .plate p { margin-bottom:.8em; line-height:1.45; } .screen { padding-top:48px; } }
  </style>
</head>
<body>
<div id="stage">
  <img id="scene" src="assets/village.png" alt="" width="458" height="256" />
  <div id="veil"></div>

  <div class="topbar">
    <a class="back" id="backLink" href="../language.html">←</a>
    <div class="switcher">
      <button id="btn-sw" type="button">SW</button>
      <button id="btn-en" type="button">EN</button>
    </div>
  </div>

  <!-- Экран 1: приветствие -->
  <section class="screen active" id="screen-welcome">
    <div class="plate">
      <h1 id="w-title"></h1>
      <button class="speak" id="w-audio" type="button" hidden aria-label="Listen"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      <p id="w-text"></p>
      <button class="btn" id="w-btn" type="button"></button>
    </div>
  </section>

  <!-- Экран 2: знакомство -->
  <section class="screen" id="screen-profile">
    <div class="plate wide">
      <h1 id="p-title"></h1>
      <div class="grid2">
        <div class="field"><span class="lbl" id="p-age-l"></span><div class="chips" id="p-age"></div></div>
        <div class="field"><span class="lbl" id="p-gender-l"></span><div class="chips" id="p-gender"></div></div>
        <div class="field"><label for="p-name" id="p-name-l"></label><input class="txt" id="p-name" maxlength="30" autocomplete="off" /><p class="hint" id="p-name-h"></p></div>
        <div class="field"><span class="lbl" id="p-reason-l"></span><div class="reasons" id="p-reason"></div><p class="note" id="p-note" hidden></p></div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="p-back" type="button"></button>
        <button class="btn" id="p-next" type="button" disabled></button>
      </div>
    </div>
  </section>

  <!-- Экран 3: внешность -->
  <section class="screen" id="screen-look">
    <div class="plate wide">
      <h1 id="l-title"></h1>
      <div class="looks" id="l-looks"></div>
      <div class="actions">
        <button class="btn ghost" id="l-back" type="button"></button>
        <button class="btn" id="l-next" type="button"></button>
      </div>
    </div>
  </section>

  <!-- Экран 4: урок (будет следующим шагом) -->
  <section class="screen" id="screen-lesson">
    <div class="plate">
      <h1 id="s-title"></h1>
      <p id="s-text"></p>
      <div class="actions"><button class="btn ghost" id="s-redo" type="button"></button></div>
    </div>
  </section>
</div>

<script>
  const SCENE_W = 458, SCENE_H = 256
  const i18n = {
    sw: {
      back: "← Rudi", w_title: "Karibu {village}!",
      w_text: "Umefika kuishi katika kijiji cha {plural}. Karibu! Hapa tutajifunza {lang} pamoja, na polepole tutajenga maisha yetu. Na tutajua mengi kuhusu watu wa {tribe} tukiishi hapa! Tufahamiane kwanza!",
      w_btn: "Tufahamiane",
      p_title: "Tufahamiane",
      p_age: "Una umri gani?", p_gender: "Jinsia yako", p_name: "Jina lako",
      p_name_h: "Unaweza kuandika jina lako au kubuni jina lolote unalopenda. Hilo ndilo jina watakalokuita kijijini.",
      p_reason: "Kwa nini umekuja kwa {plural}?",
      ages: ["Chini ya miaka 12", "12–17", "18–29", "30–49", "Miaka 50 na zaidi"],
      genders: ["Mwanaume", "Mwanamke"],
      reasons: ["Hapa ni mahali pa mababu zangu. Damu ya {plural} inatiririka ndani yangu.", "Nina shauku kubwa tu."],
      notes: ["Haijalishi babu yako alikuwa mbali kiasi gani. Muhimu ni kwamba wewe pia ni wa watu hawa.", ""],
      p_back: "Rudi", p_next: "Endelea",
      l_title: "Chagua mwonekano wako",
      looks: ["Ngozi nyeusi, nywele nyeusi", "Ngozi nyepesi, nywele nyepesi", "Ngozi nyepesi, nywele nyeusi"],
      soon: "Hivi karibuni",
      l_back: "Rudi", l_next: "Anza",
      s_title: "Karibu tena, {name}!", s_text: "Somo la kwanza litakuja hivi karibuni.", s_redo: "Badilisha taarifa zangu"
    },
    en: {
      back: "← Back", w_title: "Welcome to {village}!",
      w_text: "You have come to live in the village of the {plural}. Welcome! Here we will learn {lang} together and, little by little, make our life here. And we will learn so much about the {tribe} people while we live here! Let's get to know each other first!",
      w_btn: "Let's meet",
      p_title: "Let's meet",
      p_age: "How old are you?", p_gender: "Your gender", p_name: "Your name",
      p_name_h: "You can write your own name or make up any name you like. This is what you will be called in the village.",
      p_reason: "Why have you come to the {plural}?",
      ages: ["Under 12", "12–17", "18–29", "30–49", "50 and over"],
      genders: ["Male", "Female"],
      reasons: ["This is the land of my ancestors. The blood of the {plural} flows in me.", "I am just very interested."],
      notes: ["It does not matter how distant your ancestor was. What matters is that you also belong to this people.", ""],
      p_back: "Back", p_next: "Continue",
      l_title: "Choose your look",
      looks: ["Dark skin, dark hair", "Light skin, light hair", "Light skin, dark hair"],
      soon: "Coming soon",
      l_back: "Back", l_next: "Start",
      s_title: "Welcome back, {name}!", s_text: "The first lesson is coming soon.", s_redo: "Change my details"
    }
  }

  let lang = localStorage.getItem('lh_lang') || 'sw'
  if (!i18n[lang]) lang = 'sw'
  let L = { id: 'kikurya', name: 'Kikurya', tribe: 'Kurya', member_plural: 'Wakurya' }
  const SB_URL = 'https://geogbanccumdcaymhkdb.supabase.co'
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlb2diYW5jY3VtZGNheW1oa2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MDk4MjgsImV4cCI6MjA5MTk4NTgyOH0.BL1np5CpfddNE_S7x_bmHBqTHG-L7xn8PE5Jk3XIUx0'
  const ROOT_PHRASE = { topic: 'nouns', id: 'i26_pl' }      // «корни» (мн. ч.): название деревни
  let village = { text: null, audio: null }                 // из базы; если записи нет, показываем Mizizi / Roots
  const villageName = () => village.text || (lang === 'en' ? 'Roots' : 'Mizizi')

  // Спрашиваем у базы фразы. Нет записи или нет связи: возвращаем пустой список, игра работает с запасным текстом.
  async function resolvePhrases(language, topic, ids, hero) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000)
    try {
      const res = await fetch(SB_URL + '/rest/v1/rpc/resolve_phrases', {
        method: 'POST', signal: ctl.signal,
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_language: language, p_topic: topic, p_phrase_ids: ids, p_hero: hero || null })
      })
      if (!res.ok) return []
      const rows = await res.json()
      return Array.isArray(rows) ? rows : []
    } catch (e) { return [] } finally { clearTimeout(timer) }
  }
  let currentAudio = null
  function playAudio(url, btn) {
    if (!url) return
    try {
      if (currentAudio) currentAudio.pause()
      currentAudio = new Audio(url)
      if (btn) { btn.classList.add('playing'); currentAudio.onended = currentAudio.onerror = () => btn.classList.remove('playing') }
      currentAudio.play().catch(() => btn && btn.classList.remove('playing'))
    } catch (e) {}
  }

  let P = { age: null, gender: null, name: '', reason: null, look: 0 }   // ответы ученика
  let current = 'screen-welcome'
  const AGE_KEYS = ['u12', '12-17', '18-29', '30-49', '50+'], GENDER_KEYS = ['m', 'f'], REASON_KEYS = ['roots', 'interest']
  const HERO_IMG = { m: 'assets/hero_m_idle.png', f: 'assets/hero_f_idle.png' }
  const $ = id => document.getElementById(id)

  function fill(str) {
    return str.replace(/\{lang\}/g, L.name).replace(/\{tribe\}/g, L.tribe || L.name)
              .replace(/\{plural\}/g, L.member_plural || L.tribe || L.name).replace(/\{name\}/g, P.name).replace(/\{village\}/g, villageName())
  }
  function loadProfile() { try { const j = JSON.parse(localStorage.getItem('lh_profile') || 'null'); return j && j.name ? j : null } catch (e) { return null } }
  function saveProfile() { try { localStorage.setItem('lh_profile', JSON.stringify(P)) } catch (e) {} }

  function chips(el, labels, keys, key, onPick) {
    el.innerHTML = ''
    labels.forEach((lab, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (P[key] === keys[i] ? ' sel' : '')
      b.textContent = fill(lab); b.onclick = () => { P[key] = keys[i]; onPick && onPick(); render() }
      el.appendChild(b)
    })
  }

  function render() {
    const t = i18n[lang]
    document.documentElement.lang = lang
    $('btn-sw').classList.toggle('active', lang === 'sw'); $('btn-en').classList.toggle('active', lang === 'en')
    $('backLink').textContent = t.back
    // 1
    $('w-audio').hidden = !village.audio
    $('w-title').textContent = fill(t.w_title); $('w-text').textContent = fill(t.w_text); $('w-btn').textContent = t.w_btn
    // 2
    $('p-title').textContent = t.p_title; $('p-age-l').textContent = t.p_age; $('p-gender-l').textContent = t.p_gender
    $('p-name-l').textContent = t.p_name; $('p-name-h').textContent = t.p_name_h; $('p-reason-l').textContent = fill(t.p_reason)
    chips($('p-age'), t.ages, AGE_KEYS, 'age'); chips($('p-gender'), t.genders, GENDER_KEYS, 'gender')
    const rs = $('p-reason'); rs.innerHTML = ''
    t.reasons.forEach((lab, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip reason' + (P.reason === REASON_KEYS[i] ? ' sel' : '')
      b.textContent = fill(lab); b.onclick = () => { P.reason = REASON_KEYS[i]; render() }; rs.appendChild(b)
    })
    const ri = REASON_KEYS.indexOf(P.reason), note = $('p-note')
    note.hidden = !(ri >= 0 && t.notes[ri]); if (!note.hidden) note.textContent = fill(t.notes[ri])
    $('p-back').textContent = t.p_back; $('p-next').textContent = t.p_next
    $('p-next').disabled = !(P.age && P.gender && P.name.trim() && P.reason)
    // 3
    $('l-title').textContent = t.l_title; $('l-back').textContent = t.l_back; $('l-next').textContent = t.l_next
    const box = $('l-looks'); box.innerHTML = ''
    t.looks.forEach((cap, i) => {
      const ready = i === 0
      const b = document.createElement('button'); b.type = 'button'; b.className = 'look' + (P.look === i ? ' sel' : ''); b.disabled = !ready
      const g = P.gender === 'f' ? 'f' : 'm'
      b.innerHTML = '<div class="pic">' + (ready ? '<img alt="" src="' + HERO_IMG[g] + '">' : '<span class="q">?</span>') + '</div>'
                  + '<div class="cap"></div>'
      b.querySelector('.cap').textContent = cap
      if (!ready) { const sp = document.createElement('span'); sp.className = 'soon'; sp.textContent = t.soon; b.querySelector('.cap').appendChild(sp) }
      b.onclick = () => { P.look = i; render() }
      box.appendChild(b)
    })
    // 4
    $('s-title').textContent = fill(t.s_title); $('s-text').textContent = t.s_text; $('s-redo').textContent = t.s_redo
  }
  function setLang(l) { lang = l; try { localStorage.setItem('lh_lang', l) } catch (e) {} render() }

  function fit() {
    const s = Math.max(1, Math.ceil(Math.max(innerWidth / SCENE_W, innerHeight / SCENE_H)))
    const img = $('scene'); img.style.width = SCENE_W * s + 'px'; img.style.height = SCENE_H * s + 'px'
  }
  function show(id) { current = id; document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)) }

  $('w-audio').onclick = () => playAudio(village.audio, $('w-audio'))
  $('btn-sw').onclick = () => setLang('sw'); $('btn-en').onclick = () => setLang('en')
  $('w-btn').onclick = () => show('screen-profile')
  $('p-name').oninput = e => { P.name = e.target.value.slice(0, 30); render_nextOnly() }
  function render_nextOnly() { $('p-next').disabled = !(P.age && P.gender && P.name.trim() && P.reason) }
  $('p-back').onclick = () => show('screen-welcome')
  $('p-next').onclick = () => { P.name = P.name.trim(); P.look = 0; render(); show('screen-look') }
  $('l-back').onclick = () => show('screen-profile')
  $('l-next').onclick = () => { saveProfile(); render(); show('screen-lesson') }
  $('s-redo').onclick = () => { try { localStorage.removeItem('lh_profile') } catch (e) {} P = { age: null, gender: null, name: '', reason: null, look: 0 }; $('p-name').value = ''; render(); show('screen-profile') }
  addEventListener('resize', fit)

  async function init() {
    const id = new URLSearchParams(location.search).get('id') || 'kikurya'
    $('backLink').href = '../language.html?id=' + encodeURIComponent(id)
    try { const res = await fetch('../data/languages.json'); const json = await res.json(); L = json.languages.find(l => l.id === id) || L } catch (e) {}
    const saved = loadProfile()
    if (saved) { P = saved; $('p-name').value = P.name }
    fit(); render()
    if (saved) show('screen-lesson')
    const rows = await resolvePhrases(id, ROOT_PHRASE.topic, [ROOT_PHRASE.id], null)
    if (rows[0] && rows[0].text_value) { village = { text: rows[0].text_value, audio: rows[0].audio_url || null }; render() }
  }
  init()
</script>
</body>
</html>
