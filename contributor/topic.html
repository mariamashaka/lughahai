<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lugha Hai — Ingiza Tafsiri</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .phrase-block{background:var(--white);border:1px solid var(--cream-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-bottom:var(--space-md);box-shadow:0 1px 6px var(--shadow-warm)}
    .phrase-sw{font-size:1rem;font-weight:500;color:var(--green-deep);margin-bottom:4px}
    .phrase-en{font-size:0.82rem;color:var(--text-muted);font-style:italic;margin-bottom:var(--space-sm)}
    .phrase-ctx{font-size:0.72rem;color:var(--terracotta);margin-bottom:var(--space-sm)}
    .phrase-status{font-size:0.72rem;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:var(--space-sm)}
    .status--done{background:#e8f5e9;color:#2e7d32}
    .status--pending{background:#fff8e1;color:#f57f17}
    .translation-confirmed{font-weight:600;color:var(--green-deep);margin-bottom:var(--space-sm);font-size:0.95rem}
    .audio-section{margin-top:var(--space-sm)}
    .rec-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:99px;border:none;cursor:pointer;font-size:0.82rem;font-weight:500;transition:all var(--transition)}
    .rec-btn--start{background:var(--terracotta);color:white}
    .rec-btn--stop{background:#c62828;color:white}
    .progress-bar{background:var(--cream-dark);border-radius:99px;height:8px;margin-bottom:var(--space-lg);overflow:hidden}
    .progress-bar__fill{height:100%;background:var(--green-deep);border-radius:99px;transition:width 0.3s}
    .speaker-pick{background:var(--white);border:1px solid var(--cream-border);border-radius:var(--radius-lg);padding:var(--space-xl);box-shadow:0 2px 8px var(--shadow-warm);margin-bottom:var(--space-xl)}
    .speaker-pick h2{font-size:1.1rem;color:var(--green-deep);margin-bottom:var(--space-lg)}
    .speaker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-md)}
    .speaker-option{border:2px solid var(--cream-border);border-radius:var(--radius-lg);padding:var(--space-md);cursor:pointer;transition:all var(--transition);background:var(--white);text-align:left;width:100%}
    .speaker-option:hover{border-color:var(--green-mid)}
    .speaker-option.selected{border-color:var(--green-deep);background:var(--cream)}
    .speaker-option__name{font-weight:600;color:var(--green-deep);margin-bottom:3px;font-size:0.9rem}
    .speaker-option__sub{font-size:0.72rem;color:var(--text-muted)}
    .speaker-banner{background:var(--green-deep);color:var(--cream);border-radius:var(--radius-lg);padding:var(--space-md) var(--space-lg);margin-bottom:var(--space-lg);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-sm)}
    .hidden{display:none!important}
  </style>
</head>
<body>

<nav class="nav">
  <div class="container" style="max-width:100%;padding:0 var(--space-lg);">
    <div class="nav__inner">
      <a href="../index.html" class="nav__logo">Lugha <span>Hai</span></a>
      <div style="display:flex;align-items:center;gap:var(--space-md);">
        <span id="navUser" style="font-size:0.8rem;color:var(--text-muted);"></span>
        <a href="../auth/login.html" class="btn btn--ghost btn--sm">Toka</a>
      </div>
    </div>
  </div>
</nav>

<div class="container" style="max-width:720px;padding:var(--space-xl) var(--space-lg);">

  <!-- SPEAKER PICK (only for assistants) -->
  <div id="speakerPickSection" class="hidden">
    <div class="speaker-pick">
      <h2>🎙️ Unaweka data kwa ajili ya nani leo?</h2>
      <div class="speaker-grid" id="speakerGrid"></div>
      <div style="margin-top:var(--space-lg);">
        <button class="btn btn--primary" id="confirmSpeakerBtn" onclick="confirmSpeaker()" disabled>Endelea →</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainSection" class="hidden">
    <div class="speaker-banner" id="speakerBanner">
      <div>
        <div style="font-weight:600;" id="bannerName"></div>
        <div style="font-size:0.78rem;opacity:0.8;" id="bannerSub"></div>
      </div>
      <button class="btn btn--ghost btn--sm" style="color:var(--cream);border-color:rgba(255,255,255,0.3);" id="changeSpeakerBtn" onclick="showSpeakerPick()" style="display:none;">Badilisha</button>
    </div>

    <div class="progress-bar"><div class="progress-bar__fill" id="progressFill" style="width:0%"></div></div>
    <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:var(--space-lg);" id="progressText"></div>

    <div id="phrasesList"></div>

    <div style="margin-top:var(--space-xl);display:flex;gap:var(--space-md);">
      <button class="btn btn--primary" onclick="saveAll()" id="saveBtn">💾 Hifadhi zote</button>
    </div>
    <div id="saveMsg" style="margin-top:var(--space-md);font-size:0.85rem;display:none;"></div>
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(
  'https://geogbanccumdcaymhkdb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlb2diYW5jY3VtZGNheW1oa2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MDk4MjgsImV4cCI6MjA5MTk4NTgyOH0.BL1np5CpfddNE_S7x_bmHBqTHG-L7xn8PE5Jk3XIUx0'
);

// URL params — support both old (?id=) and new (?lang=&topic=) format
const params = new URLSearchParams(window.location.search);
const langId  = params.get('lang') || params.get('language') || 'kikurya';
const topicId = params.get('topic') || params.get('id');

let currentUser = null;
let selectedSpeaker = null;
let topicData = null;
let submissionId = null;
let existingResponses = {};
let mediaRecorder = null;
let audioChunks = [];
let mySpeakers = [];

// AUTH
const { data: { user } } = await supabase.auth.getUser();
if (!user) { window.location.href = '../auth/login.html'; }
currentUser = user;
document.getElementById('navUser').textContent = user.user_metadata?.full_name || user.email;

// Check if this user is an assistant for any speakers
const { data: spk } = await supabase
  .from('speakers').select('id, full_name, language_ids')
  .eq('assistant_user_id', user.id).order('full_name');
mySpeakers = spk || [];

if (mySpeakers.length > 0) {
  showSpeakerPick();
} else {
  selectedSpeaker = null;
  await loadAndShow();
}

window.showSpeakerPick = function() {
  document.getElementById('speakerPickSection').classList.remove('hidden');
  document.getElementById('mainSection').classList.add('hidden');
  const grid = document.getElementById('speakerGrid');
  grid.innerHTML = '';

  // Self
  const selfBtn = document.createElement('button');
  selfBtn.className = 'speaker-option';
  selfBtn.innerHTML = `<div class="speaker-option__name">✍️ Mimi mwenyewe</div><div class="speaker-option__sub">Naweka data zangu</div>`;
  selfBtn.onclick = () => {
    document.querySelectorAll('.speaker-option').forEach(e => e.classList.remove('selected'));
    selfBtn.classList.add('selected');
    selectedSpeaker = null;
    document.getElementById('confirmSpeakerBtn').disabled = false;
  };
  grid.appendChild(selfBtn);

  mySpeakers.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'speaker-option';
    btn.innerHTML = `<div class="speaker-option__name">🎙️ ${s.full_name}</div><div class="speaker-option__sub">${(s.language_ids||[]).join(', ')||'—'}</div>`;
    btn.onclick = () => {
      document.querySelectorAll('.speaker-option').forEach(e => e.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSpeaker = { id: s.id, name: s.full_name };
      document.getElementById('confirmSpeakerBtn').disabled = false;
    };
    grid.appendChild(btn);
  });
}

window.confirmSpeaker = async function() {
  document.getElementById('speakerPickSection').classList.add('hidden');
  await loadAndShow();
}

async function loadAndShow() {
  if (!topicId) {
    document.getElementById('mainSection').innerHTML = '<p style="color:var(--terracotta);">Hitilafu: mada haikupatikana katika URL.</p>';
    document.getElementById('mainSection').classList.remove('hidden');
    return;
  }

  // Load topic from index.json
  const indexRes = await fetch('../data/index.json');
  const index = await indexRes.json();
  const entry = index.find(e => e.id === topicId);

  if (!entry) {
    document.getElementById('mainSection').innerHTML = `<p style="color:var(--terracotta);">Hitilafu: mada "${topicId}" haikupatikana.</p>`;
    document.getElementById('mainSection').classList.remove('hidden');
    return;
  }

  const tr = await fetch('../' + entry.path);
  topicData = await tr.json();

  // Banner
  const speakerName = selectedSpeaker ? selectedSpeaker.name : (currentUser.user_metadata?.full_name || currentUser.email);
  document.getElementById('bannerName').textContent = '🎙️ ' + speakerName;
  document.getElementById('bannerSub').textContent = langId + ' · ' + (topicData.name?.sw || topicId);
  if (mySpeakers.length > 0) document.getElementById('changeSpeakerBtn').style.display = '';

  // Submission
  const { data: existing } = await supabase.from('submissions').select('id')
    .eq('user_id', currentUser.id).eq('language_id', langId).eq('topic_id', topicId).maybeSingle();

  if (existing) {
    submissionId = existing.id;
  } else {
    const { data: newSub } = await supabase.from('submissions')
      .insert({ user_id: currentUser.id, language_id: langId, topic_id: topicId, status: 'in_progress', speaker_id: selectedSpeaker?.id || null })
      .select().single();
    submissionId = newSub?.id;
  }

  // Load existing responses
  const { data: responses } = await supabase.from('phrase_responses')
    .select('phrase_id, translation, audio_url').eq('submission_id', submissionId);
  existingResponses = {};
  (responses || []).forEach(r => { existingResponses[r.phrase_id] = r; });

  renderPhrases();
  document.getElementById('mainSection').classList.remove('hidden');
}

function renderPhrases() {
  const list = document.getElementById('phrasesList');
  list.innerHTML = '';

  const allPhrases = [];
  (topicData.blocks || []).forEach(b => (b.phrases||[]).forEach(p => allPhrases.push(p)));

  const done = allPhrases.filter(p => existingResponses[p.id]?.translation).length;
  const pct = allPhrases.length ? Math.round(done / allPhrases.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${allPhrases.length} misemo imekamilika`;

  allPhrases.forEach(p => {
    const ex = existingResponses[p.id];
    const div = document.createElement('div');
    div.className = 'phrase-block';
    div.id = 'block_' + p.id;

    const ctx = p.ctx_sw ? `<div class="phrase-ctx">${p.ctx_sw}</div>` : '';
    const audioHtml = ex?.audio_url ? `<audio controls src="${ex.audio_url}" style="height:32px;margin-top:4px;"></audio>` : '';

    if (ex?.translation) {
      // Already done
      div.innerHTML = `
        <div class="phrase-sw">${p.sw}</div>
        <div class="phrase-en">${p.en}</div>
        ${ctx}
        <span class="phrase-status status--done">✓ Imekamilika</span>
        <div class="translation-confirmed">→ ${ex.translation}</div>
        ${audioHtml}
        <div style="margin-top:var(--space-sm);display:flex;gap:var(--space-sm);">
          <button class="btn btn--ghost btn--sm" onclick="editPhrase('${p.id}')">✏️ Badilisha</button>
        </div>`;
    } else {
      // Not done
      div.innerHTML = `
        <div class="phrase-sw">${p.sw}</div>
        <div class="phrase-en">${p.en}</div>
        ${ctx}
        <span class="phrase-status status--pending">○ Inasubiri</span>
        <div style="margin-top:var(--space-sm);">
          <input type="text" class="form-input" id="trans_${p.id}" placeholder="Andika tafsiri hapa..." style="margin-bottom:var(--space-sm);" />
          <button class="btn btn--secondary btn--sm" onclick="confirmTrans('${p.id}')">✓ Thibitisha tafsiri</button>
        </div>
        <div class="audio-section hidden" id="audio_${p.id}">
          <div class="phrase-sw" style="margin-top:var(--space-md);">${p.sw}</div>
          <button class="rec-btn rec-btn--start" id="recbtn_${p.id}" onclick="startRec('${p.id}')">🎙 Rekodi sauti</button>
        </div>`;
    }
    list.appendChild(div);
  });
}

window.confirmTrans = function(phraseId) {
  const val = document.getElementById('trans_' + phraseId)?.value?.trim();
  if (!val) { alert('Andika tafsiri kwanza!'); return; }
  document.getElementById('audio_' + phraseId).classList.remove('hidden');
}

window.editPhrase = function(phraseId) {
  const ex = existingResponses[phraseId];
  const block = document.getElementById('block_' + phraseId);
  const p = getAllPhrases().find(x => x.id === phraseId);
  if (!p) return;
  const ctx = p.ctx_sw ? `<div class="phrase-ctx">${p.ctx_sw}</div>` : '';
  block.innerHTML = `
    <div class="phrase-sw">${p.sw}</div>
    <div class="phrase-en">${p.en}</div>
    ${ctx}
    <span class="phrase-status status--pending">○ Inasubiri</span>
    <div style="margin-top:var(--space-sm);">
      <input type="text" class="form-input" id="trans_${p.id}" value="${ex?.translation||''}" style="margin-bottom:var(--space-sm);" />
      <button class="btn btn--secondary btn--sm" onclick="confirmTrans('${p.id}')">✓ Thibitisha tafsiri</button>
    </div>
    <div class="audio-section hidden" id="audio_${p.id}">
      <div class="phrase-sw" style="margin-top:var(--space-md);">${p.sw}</div>
      <button class="rec-btn rec-btn--start" id="recbtn_${p.id}" onclick="startRec('${p.id}')">🎙 Rekodi tena</button>
    </div>`;
}

function getAllPhrases() {
  const all = [];
  (topicData?.blocks||[]).forEach(b => (b.phrases||[]).forEach(p => all.push(p)));
  return all;
}

window.startRec = async function(phraseId) {
  if (mediaRecorder) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    mediaRecorder = null;
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.onstop = () => uploadAudio(phraseId);
  mediaRecorder.start();
  const btn = document.getElementById('recbtn_' + phraseId);
  btn.className = 'rec-btn rec-btn--stop';
  btn.innerHTML = '⏹ Simama';
}

async function uploadAudio(phraseId) {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const fileName = `${submissionId}_${phraseId}_${Date.now()}.webm`;
  const { error } = await supabase.storage.from('audio').upload(fileName, blob, { contentType: 'audio/webm', upsert: true });
  const btn = document.getElementById('recbtn_' + phraseId);
  btn.className = 'rec-btn rec-btn--start';
  btn.innerHTML = '🎙 Rekodi tena';
  if (!error) {
    const { data: urlData } = supabase.storage.from('audio').getPublicUrl(fileName);
    if (!existingResponses[phraseId]) existingResponses[phraseId] = {};
    existingResponses[phraseId].audio_url = urlData.publicUrl;
    const audioDiv = document.getElementById('audio_' + phraseId);
    if (audioDiv) {
      const existing = audioDiv.querySelector('audio');
      if (existing) existing.remove();
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = urlData.publicUrl;
      audio.style.height = '32px';
      audio.style.marginTop = '4px';
      audioDiv.appendChild(audio);
    }
  }
}

window.saveAll = async function() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '⏳ Inahifadhi...';

  const allPhrases = getAllPhrases();
  const speakerId = selectedSpeaker?.id || null;

  for (const p of allPhrases) {
    const trans = document.getElementById('trans_' + p.id)?.value?.trim() || existingResponses[p.id]?.translation;
    if (!trans) continue;
    const audioUrl = existingResponses[p.id]?.audio_url || null;

    if (existingResponses[p.id]?.translation !== undefined) {
      await supabase.from('phrase_responses')
        .update({ translation: trans, audio_url: audioUrl, speaker_id: speakerId })
        .eq('submission_id', submissionId).eq('phrase_id', p.id);
    } else {
      await supabase.from('phrase_responses')
        .insert({ submission_id: submissionId, phrase_id: p.id, translation: trans, audio_url: audioUrl, speaker_id: speakerId });
    }
    if (!existingResponses[p.id]) existingResponses[p.id] = {};
    existingResponses[p.id].translation = trans;
  }

  await supabase.from('submissions').update({ status: 'submitted' }).eq('id', submissionId);
  btn.disabled = false; btn.textContent = '💾 Hifadhi zote';
  const msg = document.getElementById('saveMsg');
  msg.style.display = 'block';
  msg.style.color = 'var(--green-deep)';
  msg.textContent = '✅ Imehifadhiwa! Asante kwa mchango wako.';
  renderPhrases();
}
</script>
</body>
</html>
